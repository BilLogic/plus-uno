name: uno-bot — embed blueprint (semantic_search)

# Backfills / refreshes the blueprint's semantic index: reads the read-only
# source view, embeds each chunk, writes the vectors. Additive + read-only
# w.r.t. the blueprint (never writes to public.*).
#
# Run it by hand (Actions → this workflow → Run workflow) or let the nightly
# schedule refresh changed cells.
#
# TWO PASSES, ONE INDEX. The first embeds with the model `index_meta` names for
# the blueprint index — the set every reader shares. The second is for people
# who search with their OWN key from the in-app agent: a question embedded by
# OpenAI cannot be scored against cells embedded by Google, so serving them
# needs a second set built with their model, beside the first.
#
# The second pass is here with no key behind it, on purpose. It SKIPS with a
# message and exits 0 every night, so turning the capability on is setting one
# secret rather than editing a workflow — and so that the day somebody does set
# it, the job that builds the index is one that has been running all along.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE_KEY   service-role key for the UNO Blueprint project
#   GEMINI_SA_EMAIL             Vertex service-account client_email (same account
#                               the bot uses — the one that also enables Claude-on-Vertex)
#   GEMINI_SA_PRIVATE_KEY       Vertex service-account private_key (full PEM block)
# (Alternatively a single GEMINI_API_KEY works too; the script auto-detects.)
# Optional:
#   OPENAI_API_KEY              turns the second pass on. UNSET in this
#                               deployment, and the pass skips without it.
# Non-secret values are set inline below.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Re-embed every chunk, not just changed ones. REQUIRED after any change to blueprint_chunks_src — a view change alters chunk TEXT without moving cells.updated_at, so the incremental pass would skip everything."
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  # (A temporary dev-branch push trigger was used for the initial backfill on
  # 2026-07-16 — 588 chunks loaded — then removed. workflow_dispatch + the
  # nightly schedule are the standing triggers once this is on main.)

permissions:
  contents: read
  issues: write # a blocked nightly is filed as an `automation-blocked` issue

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Embed + upsert blueprint chunks
        env:
          SUPABASE_URL: "https://osybxeojvsqcwxkgnalm.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Embedding credential — the Vertex service account (same one the bot
          # uses). GEMINI_API_KEY is an optional alternative; the script auto-detects.
          GEMINI_PROJECT_ID: "hcii-plus"
          GEMINI_SA_EMAIL: ${{ secrets.GEMINI_SA_EMAIL }}
          GEMINI_SA_PRIVATE_KEY: ${{ secrets.GEMINI_SA_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBED_REGION: "us-central1"
        run: node agents/uno-bot/scripts/backfill-semantic-search.mjs ${{ inputs.full && '--full' || '' }}

      # The second set, for people searching from the in-app agent on an OpenAI
      # key. With no OPENAI_API_KEY this prints a skip and exits 0; it is not
      # `continue-on-error`, because a key that IS set and rejected must still
      # turn the run red — that one is somebody waiting for an index.
      #
      # AND THEN THE INDEX MUST BE LISTED. Building the set is not the last
      # step: uno's `agent.search.indexes` has to name it before anybody is
      # offered the tool, and naming it BEFORE the set exists makes every
      # meaning search raise. See the app repo's
      # docs/engineering/access-and-security.md.
      - name: Embed the OpenAI set, when there is a key for it
        env:
          SUPABASE_URL: "https://osybxeojvsqcwxkgnalm.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          node agents/uno-bot/scripts/backfill-semantic-search.mjs
          --model=text-embedding-3-small ${{ inputs.full && '--full' || '' }}

      # A silent nightly is how this job rotted before: the orphan prune 403'd
      # from 2026-08-18 (the semantic_search migration granted service_role
      # select/insert/update but not delete) and nothing said so. Because the
      # prune runs AFTER the upsert, the data looked healthy — embeddings
      # current, chunks for deleted cells accumulating — so only the red run
      # carried the signal, and nobody was watching Actions.
      #
      # One open `automation-blocked` issue at a time: re-comment on the
      # existing one rather than filing a new issue every night.
      - name: File an ops intake when the backfill is blocked
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="uno-bot embed-blueprint: nightly backfill is blocked"

          # `gh issue create --label X` errors when the label is missing —
          # ensure it idempotently, same as harness-integrity-sweep.
          gh label create automation-blocked --repo "$GITHUB_REPOSITORY" \
            --description "A scheduled automation could not run — ops signal, not a design intake" \
            --color B60205 || true

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label automation-blocked --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          BODY="The nightly semantic_search backfill failed.

          Run: $RUN_URL

          The semantic index feeds \`search_blueprint\`'s primary retrieval path.
          While this is red, embeddings stop refreshing and chunks for deleted
          cells are never pruned — the bot can then cite a cell that no longer
          exists and hand out a \`?cell=\` link that resolves to nothing.

          Check the run log for the failing step before re-running."

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --label automation-blocked --body "$BODY"
          fi

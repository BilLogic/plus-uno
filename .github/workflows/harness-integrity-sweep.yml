name: Harness Integrity Sweep

# Monthly conventions-integrity sweep (registry: docs/engineering/operations.md).
# Loop shape: time-based cron → single-pass checklist → issue intakes → stop.
# The checklist lives in skills/uno-maintain/references/staleness-sweep.md; the
# prompt file is only the headless adapter (never duplicate the logic here).
# Spot-run: `gh workflow run harness-integrity-sweep.yml`.
#
# Executor: Claude Code CLI on Vertex — billed to the hcii-plus GCP project via
# the same service account as uno-bot (ADR-018). Model: action default (sonnet).
# Required repo secrets: GEMINI_SA_EMAIL, GEMINI_SA_PRIVATE_KEY.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 1 * *" # 1st of the month, 09:00 UTC — feeds the monthly retro

permissions:
  contents: read
  issues: write # findings are filed as `harness-intake` issues

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false # gh uses GH_TOKEN from env; no token in .git/config

      # Every deterministic check below ALSO runs per-PR since 2026-08-26
      # (`check-harness.yml` → `npm run check:harness`, #155). They stay here on
      # purpose: `main` is unprotected, so a direct push reaches it without ever
      # meeting the PR gate, and this monthly pass is what sees that. The steps
      # are kept spelled out rather than collapsed into the composite because
      # each one's rationale is written here and is worth keeping — this list is
      # a backstop, and it is fine for it to lag the composite's membership.

      # Deterministic registry-drift check, promoted from loose scripts (ce:review
      # 069 item 5): before this, check:component-registry / check:token-registry
      # ran only when an agent obeyed prose — drift was caught by luck. Node with
      # no npm install: both generators are dependency-free.
      - name: Registry drift check (deterministic)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Run registry checks
        run: |
          npm run check:component-registry
          npm run check:token-registry

      # The intake FSM (.cursor/hooks/uno-prototype/) gates every prototype run,
      # but its suite had no runner — it passed only when someone invoked node by
      # hand. A test nobody runs protects nothing, so it rides the same monthly
      # deterministic pass as the registries. Dependency-free; no npm install.
      - name: Intake FSM smoke tests
        run: npm run check:intake-fsm

      # The six skills reach the IDEs and Slack only through generated surfaces
      # (.claude/skills/ stubs, the Worker's command map, the app-manifest
      # block). Edit a SKILL.md description without regenerating and the slash
      # menu quietly describes the old skill — invisible until someone reads it.
      # Dependency-free; no npm install.
      - name: Skill-surface drift check
        run: npm run check:skill-surfaces

      # docs/knowledge/ became sediment because nothing forced a note to say
      # what it became (#172). This is the forcing function: a file there
      # without a `disposition:` fails the sweep. Dependency-free; no npm install.
      - name: Knowledge disposition check
        run: npm run check:knowledge-disposition

      # A skill states each rule once — in references/method.md — and each face
      # carries only its delta (skills/README.md § Where content goes). Two
      # copies of a rule is two rules the moment one is edited, and each file
      # still reads correctly alone, so nothing surfaces the drift. The tests
      # ride along because a guard nobody has watched fail is a guard nobody
      # knows works (#191). Dependency-free; no npm install.
      - name: Skill overlap check
        run: |
          npm run check:skill-overlap
          npm run test:scripts

      # THE ONE PLACE THE CROSS-REPO SWEEP ACTUALLY COMPARES ANYTHING (#425).
      #
      # `check:cross-repo` is composed into `check:harness`, so it runs on every
      # PR — but that job installs no root dependencies by design, and clones no
      # siblings, so on a PR runner it reaches only this repo and says so loudly
      # (`::warning::` + a job-summary line) rather than reporting a pass it did
      # not earn. That is the right trade there: a gate that can go red because
      # another repository's `main` moved is a gate somebody marks not-required
      # the first busy week, which is the failure `check-harness.yml`'s header is
      # entirely about. It would be the wrong trade as the LAST word, though: a
      # check that never compares anywhere is `check:contract` before #258 —
      # believed, and empty.
      #
      # So the comparison lives here, on the monthly backstop, where a finding
      # becomes a `harness-intake` issue instead of a blocked pull request. Both
      # siblings are public, so a plain checkout needs no token.
      #
      # `.sibling-repos/` is dot-prefixed on purpose: every sweep's walk skips
      # dot-directories, so the clones cannot be read as part of this repo.
      #
      # `continue-on-error` because a clone that fails must degrade to the loud
      # skip the script already knows how to print, never take the month's sweep
      # down with it.
      - name: The sb pin, read from package.json so it has one home
        id: sb-pin
        run: node -p "'ref=' + require('./package.json').devDependencies['agentic-service-blueprinting'].split('#')[1]" >> "$GITHUB_OUTPUT"
      - name: Check out plus-uno-blueprint beside this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        continue-on-error: true
        with:
          repository: BilLogic/plus-uno-blueprint
          path: .sibling-repos/plus-uno-blueprint
          persist-credentials: false
      - name: Check out agentic-service-blueprinting at the pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        continue-on-error: true
        with:
          repository: BilLogic/agentic-service-blueprinting
          ref: ${{ steps.sb-pin.outputs.ref }}
          path: .sibling-repos/agentic-service-blueprinting
          persist-credentials: false
      - name: Cross-repo duplicate sweep (the comparison, for real)
        env:
          BLUEPRINT_REPO: .sibling-repos/plus-uno-blueprint
          SB_REPO: .sibling-repos/agentic-service-blueprinting
        run: npm run check:cross-repo

      - name: Ensure intake labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh issue create --label X` errors if the label is missing —
          # ensure both intake labels deterministically, idempotently.
          gh label create harness-intake --repo "$GITHUB_REPOSITORY" \
            --description "Headless sweep finding awaiting uno-maintain triage" \
            --color D93F0B || true
          gh label create automation-blocked --repo "$GITHUB_REPOSITORY" \
            --description "A scheduled automation could not run — ops signal, not a design intake" \
            --color B60205 || true

      - name: Run integrity sweep (Claude on Vertex)
        uses: ./.github/actions/claude-vertex
        env:
          GH_TOKEN: ${{ github.token }} # for `gh issue` intake filing
        with:
          prompt-file: scripts/prompts/uno-integrity-sweep/SKILL.md
          max-turns: "60"
          # Injection boundary: repo reads + issue filing + the checklist's
          # named script. No arbitrary shell, no network beyond gh.
          allowed-tools: "Read,Grep,Glob,Bash(gh issue list:*),Bash(gh issue create:*),Bash(bash scripts/validate-doc-links.sh:*)"
          sa-email: ${{ secrets.GEMINI_SA_EMAIL }}
          sa-private-key: ${{ secrets.GEMINI_SA_PRIVATE_KEY }}

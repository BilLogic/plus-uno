name: uno-bot — evals (R-scenarios vs live Worker)

# Runs docs/evals/fixtures/uno-bot-cases.json through the DEPLOYED Worker's
# /debug/eval route — which since #499 is an ADAPTER over the Turn module, so a
# case takes the same turn a Slack message does (preflight, the confidence
# pre-check, the absence check, the draft judge, the history write) with Delivery
# recording instead of posting and a resolution recorded instead of executed:
# still nothing reaches Slack or Notion, and proposals still come back as data.
# THE FIRST RUN ON A BUILD CARRYING #499 IS THE RE-BASELINE — record its
# per-case before/after against the last pre-#499 run in docs/evals/runs/
# (docs/evals/README.md § RE-BASELINE PENDING). Scores each case with deterministic checks
# + a Gemini judge against the D1-D9 rubric. A failing BLOCKER case fails the
# job. Full transcripts upload as the eval-results artifact for reasoning
# investigation.
#
# Run AFTER a `wrangler deploy` to regression-check the new build (the evals
# hit the live Worker, so they test what's actually serving).
#
# Required repo secrets: DEBUG_TOKEN, GEMINI_SA_EMAIL, GEMINI_SA_PRIVATE_KEY.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC — weekly drift check (paused 2026-09-04 while the
                        # harness was known-stale; restored 2026-09-05 after #412 and #415 landed)

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Run eval cases against the live Worker
        env:
          # Set vars.UNO_BOT_WORKER_URL to point evals at another deployment;
          # the literal is the fallback and the single other copy of it lives in
          # agents/uno-bot/scripts/worker-url.mjs (#288).
          WORKER_URL: ${{ vars.UNO_BOT_WORKER_URL || 'https://uno-bot.plus-uno.workers.dev' }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          GEMINI_SA_EMAIL: ${{ secrets.GEMINI_SA_EMAIL }}
          GEMINI_SA_PRIVATE_KEY: ${{ secrets.GEMINI_SA_PRIVATE_KEY }}
          GEMINI_PROJECT_ID: "hcii-plus"
                    # Judge on the grind model, one tier above the bot. Same-model judging shares
          # the bot's blind spots (self-preference); a judge should be at least as
          # strong as what it grades. Decided 2026-09-04.
          JUDGE_MODEL: "gemini-3.1-pro-preview"
        run: node agents/uno-bot/scripts/run-evals.mjs
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: eval-results.json

# Throwaway: measures how closely files across the six PLUS Figma teams follow
# docs/connectors/figma.md. Read-only GETs only. Never merged.
# Pass 2 counts the conventions files actually use.
# Prints aggregate counts, RM ids, and at most 5 example names per category.
# Never prints comment text, handles or emails.
name: figma-conventions-probe
on:
  pull_request:
    paths: [".github/workflows/figma-conventions-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Probe
        env:
          T: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          node - <<'JS'
          const T = process.env.T;
          const teams = {
            Universal: "1279226364199713409", Training: "1279227480162592555",
            Toolkit: "1279227565411025715", Admin: "1279229084983452695",
            Others: "1279227354789670676", MISC: "1279241534978917312",
          };
          const SAMPLE = 25, PACE_MS = 1500, NOW = Date.now(), DAY = 86400000;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          let calls = 0;
          async function get(p, tries = 0) {
            await sleep(PACE_MS); calls++;
            const r = await fetch("https://api.figma.com" + p, { headers: { "X-Figma-Token": T } });
            if (r.status === 429 && tries < 4) {
              const wait = Math.min(Number(r.headers.get("retry-after") || 30), 120) * 1000;
              console.log(`429 on ${p.split("?")[0].replace(/[A-Za-z0-9]{15,}/g, "…")}; waiting ${wait / 1000}s`);
              await sleep(wait); return get(p, tries + 1);
            }
            let j = {}; try { j = await r.json(); } catch {}
            return [r.status, j];
          }
          const errOf = (j) => String(j.err || j.message || j.error || "").slice(0, 200);
          const arr = (j, ...keys) => { for (const k of keys) if (Array.isArray(j?.[k])) return j[k]; return []; };
          const ex = (list, x) => { if (list.length < 5) list.push(x); };

          const PREFIX = /^\s*\[(wip|spec|replica|archive)\]/;
          const PREFIX_CI = /^\s*\[(wip|spec|replica|archive)\]/i;
          const NEAR = /\b(wip|spec|replica|archive|draft|final|old|deprecated|explor\w*)\b/i;
          const FILE_CONV = /^[^·]+ · [^·]+ · RM-\d+\s*$/;
          const RM = /\bRM[-_ ]?(\d+)\b/i;
          const OFFICIAL = /^\s*1\s*[·.\-:)]?\s*official\b/i;
          const OFFICIAL_LOOSE = /official/i;
          const NUMBERED = /^\s*\d+\s*[·.\-:)]?\s+\S/;
          const VFORK = /[-_ ]v\d+\b/i;
          const TOPTYPES = new Set(["FRAME", "SECTION", "COMPONENT", "COMPONENT_SET", "GROUP", "INSTANCE"]);

          // Pass 2: the conventions files actually use. Full listing for names;
          // the same evenly spaced sample at depth=1 for page schemes and comments.
          const CARD = /\bCard\s*#?\s*(\d+(?:\s*(?:&|,|and|\+)\s*\d+)*)/i;
          const SLASH3 = /^[^/]+\/[^/]+\/[^/]+$/;
          const LEGACY = /\/\s*Legacy\s*\//i;
          const SECT = { cover: /cover/i, specs: /spec/i, wip: /wip/i, playground: /playground/i, review: /review/i, archive: /archive/i };
          for (const [team, id] of Object.entries(teams)) {
            const t = { filesListed: 0, slash3: 0, card: 0, legacy: 0, other: 0, cardIds: [], otherEx: [],
              sampled: 0, readOk: 0, sectionScheme: 0, hasSpecs: 0, hasWip: 0, hasPlayground: 0, hasReview: 0, hasArchive: 0,
              wipPageStale30: 0, specsTop: 0, wipTop: 0, reviewTop: 0,
              commentsInStale90: 0, unresolvedInStale90: 0, unresolvedTotal: 0, maxThreadsOneFile: 0 };
            const [, j] = await get(`/v2/teams/${id}/folders`);
            const files = [];
            for (const f of arr(j, "folders")) { const [, fj] = await get(`/v2/folders/${f.id}/files`); files.push(...arr(fj, "files")); }
            t.filesListed = files.length;
            for (const f of files) {
              const n = f.name || "";
              if (SLASH3.test(n)) t.slash3++;
              const c = n.match(CARD);
              if (c) { t.card++; t.cardIds.push(...c[1].match(/\d+/g).map(Number)); }
              else if (LEGACY.test(n)) t.legacy++;
              else { t.other++; ex(t.otherEx, n); }
            }
            t.cardIds = [...new Set(t.cardIds)].sort((a, b) => a - b);
            files.sort((a, b) => String(a.last_modified).localeCompare(String(b.last_modified)));
            const sample = files.length <= SAMPLE ? files
              : Array.from({ length: SAMPLE }, (_, i) => files[Math.floor((i * (files.length - 1)) / (SAMPLE - 1))]);
            t.sampled = sample.length;
            for (const f of sample) {
              const age = (NOW - Date.parse(f.last_modified || "")) / DAY;
              const [ds, dj] = await get(`/v1/files/${f.key}?depth=2`);
              if (ds !== 200) continue;
              t.readOk++;
              const pages = dj.document?.children || [];
              const sect = (re) => pages.filter((p) => /^\s*-\s*-\s*-/.test(p.name) && re.test(p.name));
              const has = Object.fromEntries(Object.entries(SECT).map(([k, re]) => [k, sect(re).length > 0]));
              if (has.specs && has.wip) t.sectionScheme++;
              if (has.specs) t.hasSpecs++; if (has.wip) t.hasWip++; if (has.playground) t.hasPlayground++;
              if (has.review) t.hasReview++; if (has.archive) t.hasArchive++;
              if (has.wip && age > 30) t.wipPageStale30++;
              // Pages between one "- - - X - - -" divider and the next belong to X.
              let cur = null;
              for (const p of pages) {
                if (/^\s*-\s*-\s*-/.test(p.name)) { cur = SECT.specs.test(p.name) ? "specs" : SECT.wip.test(p.name) ? "wip" : SECT.review.test(p.name) ? "review" : null; continue; }
                const tops = (p.children || []).filter((x) => TOPTYPES.has(x.type)).length;
                if (cur === "specs") t.specsTop += tops; else if (cur === "wip") t.wipTop += tops; else if (cur === "review") t.reviewTop += tops;
              }
              const [cs, cj] = await get(`/v1/files/${f.key}/comments`);
              if (cs !== 200) continue;
              const top = arr(cj, "comments").filter((c) => !c.parent_id);
              const un = top.filter((c) => !c.resolved_at).length;
              t.unresolvedTotal += un;
              t.maxThreadsOneFile = Math.max(t.maxThreadsOneFile, top.length);
              if (age > 90) { t.commentsInStale90 += top.length; t.unresolvedInStale90 += un; }
            }
            console.log(`\n=== ${team} (pass 2) ===\n${JSON.stringify(t)}`);
          }
          console.log(`\nTOTAL API calls: ${calls}`);
          JS

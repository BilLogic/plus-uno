[build]
  command = "npm run build:all"
  publish = "dist"

# Production publishes only on a release Bill calls, not on every merge. Each production deploy
# costs 15 Netlify credits; deploy previews and branch deploys are free. A push
# to main is skipped here (exit 0 = skip); a build started by the
# production build hook (titled daily-production; INCOMING_HOOK_TITLE is set) runs. The hook is
# called by .github/workflows/netlify-production-deploy.yml, run by hand.
[context.production]
  ignore = "test -z \"$INCOMING_HOOK_TITLE\""

# The docs AI agent (netlify/functions/docs-agent). Its grounding is the generated
# design-system index, bundled with the function. Credentials (GEMINI_SA_EMAIL,
# GEMINI_SA_PRIVATE_KEY, GEMINI_PROJECT_ID, GEMINI_MODEL) are Netlify environment
# variables: docs/engineering/setup.md.
[functions]
  directory = "netlify/functions"

[functions."docs-agent"]
  included_files = [
    "design-system/guidelines/overview.md",
    "design-system/agent-views/components/index.md",
    "design-system/agent-views/tokens/tokens.md",
  ]

# The hosted design-system MCP (netlify/functions/ds-mcp), served at /mcp/ds. Read-only, behind
# DS_MCP_KEY (a Netlify environment variable). It answers from the repo files below, bundled
# into the function, so it serves the design system this deploy's Storybook is built from.
# These are the files the five lookup tools open at runtime (ds-mcp.test.mjs fails when one is
# missing here). ds_check also reads every custom property declared under the three source
# roots, hence their style and script globs.
[functions."ds-mcp"]
  included_files = [
    "design-system/agent-views/**",
    "design-system/guidelines/**",
    "design-system/figma/component-registry.json",
    "design-system/src/**/*.{js,jsx,tsx,scss,css,mdx}",
    "prototypes/**/*.{js,jsx,tsx,scss,css}",
    "docs/engineering/ds-usage-rules.md",
    "docs/conventions/design-system-glossary.md",
  ]

# The hosted design-system MCP
[[redirects]]
  from = "/mcp/ds"
  to = "/.netlify/functions/ds-mcp"
  status = 200
  force = true

# Landing → Storybook docs
[[redirects]]
  from = "/"
  to = "/storybook/"
  status = 302
  force = true

[[redirects]]
  from = "/market"
  to = "/storybook/"
  status = 302
  force = true

# /blueprint/ is PLUS Uno Blueprint, the web app that renders the uno-blueprint
# source. It is built and deployed on its own Netlify site (plus-uno-blueprint),
# which serves it under /blueprint/, and proxied here unchanged. Forced, so
# nothing in this build under the path shadows it. Netlify does not apply
# custom headers to proxied content, so the app keeps its own CSP and cache
# headers.
[[redirects]]
  from = "/blueprint/*"
  to = "https://plus-uno-blueprint.netlify.app/blueprint/:splat"
  status = 200
  force = true

# Storybook docs ids renamed or folded on 2026-11-13 (Patterns flattened to
# Patterns/<Name>; Heading outline, Backdrop and Templates and patterns folded
# into Page, Modal and Templates overview). Storybook addresses a page by the
# `path` query, so each rule matches the old id and lands on the new one; a
# folded page lands on its section. Before the `/storybook/*` rule: first match wins.
[[redirects]]
  from = "/storybook/"
  query = { path = "/docs/patterns-actions-and-input-common-actions--docs" }
  to = "/storybook/?path=/docs/patterns-common-actions--docs"
  status = 301
  force = true


name: Refresh Figma Component Snapshot

# Re-records scripts/figma-component-snapshot.json from the PUBLISHED Figma
# library and opens (or updates) a draft PR with the result (registry:
# docs/engineering/operations.md). It runs `npm run snapshot:figma-components`,
# which reads Figma REST only and publishes nothing. The script needs
# FIGMA_ACCESS_TOKEN, and only this repo's secret holds one, which is why the
# refresh runs here and not on a laptop.
#
# Loop shape: a publish or a manual dispatch → one fetch → one PR (changed, or a
# date refresh near the age ceiling), or a "no change" summary that closes any
# stale refresh PR → stop. Never a cron: a refresh follows a library publish
# somebody meant, and each one is a PR a human reviews.
#   • ONCE PER PUBLISH (#898). uno-bot's end-of-day run, once its Figma jobs
#     are done, sends `repository_dispatch` `figma-library-published` for a
#     newly published library version (agents/uno-bot/src/figma-library/
#     snapshot-refresh.ts). The version stays owed until this run's snapshot
#     lands on main or on the refresh branch, so each night re-sends what has
#     not. Its payload's version id is shown in the summary and goes nowhere
#     else.
#   • BY HAND, still: `gh workflow run figma-snapshot-refresh.yml` (from main).
# A RATE LIMIT IS WAITED OUT. The script waits out Figma's 429s (up to 30
# minutes in all) and paces its node fetches; a run that still cannot finish
# writes nothing and says Figma was busy (exit 75), and uno-bot's next night
# completes it.
#
# Why this replaces the old poller's shape. The retired figma-library-poll.yml
# committed straight to main with "[skip ci]" and `git push || true`, so a
# failed push went unnoticed and nothing ever checked the new baseline. Here the
# snapshot goes through a PR like any other change.
#
# Why the PR is a DRAFT. A PR opened and pushed with the job's GITHUB_TOKEN
# starts no other workflow (GitHub's rule, to prevent recursive runs), so the
# pull_request gates do not run on it by themselves. The repo holds no app or
# PAT secret scoped for this, and a new secret is not added for one manual job.
# So the PR opens as a draft and its body says how to start the gates: close
# and reopen it, which is an event of the person doing it. The commit message
# carries no "[skip ci]" for the same reason: it would skip those gates too.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [figma-library-published]

permissions:
  contents: write # push the fixed refresh branch
  pull-requests: write # open or update its PR

# Two refreshes at once would force-push the same branch over each other. A
# publish found while one runs waits behind it; a newer waiting run replaces an
# older one, which is right, since each records the library as it then stands.
concurrency:
  group: figma-snapshot-refresh
  cancel-in-progress: false

env:
  SNAPSHOT: scripts/figma-component-snapshot.json
  BRANCH: chore/figma-snapshot-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The paced node fetches take about 8 minutes, and a rate limit may add up
    # to 30 more of waiting.
    timeout-minutes: 45

    steps:
      - name: Refuse a run off the default branch
        # The refresh branch is cut from whatever ref was dispatched. From any
        # branch but main, the PR would carry that branch's commits as well.
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Dispatch this workflow from $DEFAULT_BRANCH, not $REF."
            exit 1
          fi

      - name: Say what started it
        # The publish's version id arrives through env and is checked to be
        # digits before it is written anywhere; nothing from client_payload is
        # ever part of a command.
        env:
          EVENT: ${{ github.event_name }}
          VERSION_ID: ${{ github.event.client_payload.figma_version_id }}
        run: |
          if [ "$EVENT" = "repository_dispatch" ]; then
            if [[ "$VERSION_ID" =~ ^[0-9]+$ ]]; then
              echo "Started by uno-bot: the library published version $VERSION_ID." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Started by uno-bot, for a library publish." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Started by hand." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        # No npm cache and no install: both scripts import Node built-ins and
        # repo-local modules only.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Fetch the published library
        # FIGMA_FILE_KEY is left to the script's own default, the BS4 Foundation
        # library the snapshot records. A different key would re-record a
        # different library over it. --silent keeps npm's banner out of the log
        # the PR body quotes.
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        # Exit 75 is the script's "Figma kept rate-limiting": nothing written.
        run: |
          set -euo pipefail
          status=0
          npm run --silent snapshot:figma-components | tee "$RUNNER_TEMP/snapshot.log" || status=$?
          if [ "$status" -eq 75 ]; then
            {
              echo "## Figma component snapshot: Figma was busy"
              echo
              echo "Figma kept rate-limiting after the script waited, so nothing was written. uno-bot sends the refresh again tomorrow night, or re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Figma kept rate-limiting; nothing was written."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          { echo '```'; cat "$RUNNER_TEMP/snapshot.log"; echo '```'; } > "$RUNNER_TEMP/delta.md"

      - name: Compare with main
        id: compare
        # The verdict script ignores `lastChecked` (it moves on every run), row
        # order and key order. An unchanged library whose snapshot on main is
        # past half check:figma-snapshots' age ceiling reads as `date-only`, so
        # the refresh can clear that check. A file that is not JSON fails here
        # rather than reading as a change.
        run: |
          set -euo pipefail
          git show "HEAD:$SNAPSHOT" > "$RUNNER_TEMP/main-snapshot.json"
          node scripts/figma-snapshot-verdict.mjs "$RUNNER_TEMP/main-snapshot.json" "$SNAPSHOT" \
            | tee -a "$GITHUB_OUTPUT"

      - name: No change
        if: steps.compare.outputs.verdict == 'unchanged'
        # A refresh PR still open from an earlier run is stale now: main already
        # matches the library, so it is closed rather than left to be merged.
        # `--head` matches a branch NAME, so a fork's PR from a branch of the
        # same name would match too; only this repo's own head is touched, here
        # and in the edit path below.
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --head "$BRANCH" --base "$BASE" --state open \
            --json number,headRepositoryOwner,isCrossRepository \
            | jq -r --arg owner "$OWNER" \
              '[.[] | select((.isCrossRepository | not) and .headRepositoryOwner.login == $owner)][0].number // empty')
          if [ -n "$PR" ]; then
            gh pr close "$PR" --comment "Closed by [a later refresh]($RUN_URL): the published library now matches \`$SNAPSHOT\` on $BASE."
          fi
          {
            echo "## Figma component snapshot: no change"
            echo
            echo "The published library matches \`$SNAPSHOT\` on $BASE. No branch pushed, no PR opened."
            if [ -n "$PR" ]; then echo; echo "Closed the stale refresh PR #$PR."; fi
            echo
            cat "$RUNNER_TEMP/delta.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the refresh branch
        if: steps.compare.outputs.verdict != 'unchanged'
        # The branch is rebuilt from main on every run, so the force push
        # replaces an older refresh rather than stacking on it.
        env:
          VERDICT: ${{ steps.compare.outputs.verdict }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add "$SNAPSHOT"
          if [ "$VERDICT" = "date-only" ]; then
            git commit -m "chore: refresh Figma component snapshot date"
          else
            git commit -m "chore: refresh Figma component snapshot"
          fi
          git push --force origin "$BRANCH"

      - name: Open or update the draft PR
        if: steps.compare.outputs.verdict != 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
          VERDICT: ${{ steps.compare.outputs.verdict }}
          AGE_DAYS: ${{ steps.compare.outputs.age_days }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/pr-body.md"
          {
            echo "Refreshes \`$SNAPSHOT\` from the published Figma library."
            echo
            if [ "$VERDICT" = "date-only" ]; then
              echo "**Date refresh only.** The published library matches $BASE. This PR moves \`lastChecked\` forward because the snapshot on $BASE was ${AGE_DAYS:-an unreadable number of} days old, past half of the \`check:figma-snapshots\` age ceiling."
              echo
            fi
            echo "## Delta"
            echo
            cat "$RUNNER_TEMP/delta.md"
            echo
            echo "Counts are published variants, and \"sets changed\" names the component sets they belong to. The delta covers adds, removals and renames only. A change with no set named is somewhere else: a variant's \`description\` or \`nodeId\`, a node hash (a visual edit), or the publish history."
            echo
            echo "## Before merging"
            echo
            echo "This PR was opened by the workflow's \`GITHUB_TOKEN\`, and GitHub starts no other workflow from that token's events, so **the pull_request checks have not run**. To run them, close this PR and reopen it. Mark it ready for review once they pass."
            echo
            echo "Each later run force-pushes \`$BRANCH\` and rewrites this description, and its checks need another close and reopen. A later run that finds no change closes this PR."
            echo
            echo "Opened by [Refresh Figma Component Snapshot]($RUN_URL)."
          } > "$BODY"

          PR=$(gh pr list --head "$BRANCH" --base "$BASE" --state open \
            --json number,headRepositoryOwner,isCrossRepository \
            | jq -r --arg owner "$OWNER" \
              '[.[] | select((.isCrossRepository | not) and .headRepositoryOwner.login == $owner)][0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file "$BODY"
            URL=$(gh pr view "$PR" --json url --jq .url)
            VERB="Updated"
          else
            URL=$(gh pr create --draft --base "$BASE" --head "$BRANCH" \
              --title "chore: refresh Figma component snapshot" --body-file "$BODY")
            VERB="Opened"
          fi

          {
            echo "## Figma component snapshot: $VERDICT"
            echo
            echo "$VERB draft PR: $URL"
            echo
            cat "$RUNNER_TEMP/delta.md"
          } >> "$GITHUB_STEP_SUMMARY"

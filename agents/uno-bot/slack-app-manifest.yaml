# Uno-bot Slack app manifest — app A0APS0L8HJR, CMU Simon Initiative workspace.
#
# Captured from api.slack.com on 2026-08-04, after the six /uno-* slash commands
# were created. Hand-maintained: nothing generates or applies this file. It is
# the repo's record of what production actually runs on, and the rollback point
# if a manifest save goes wrong — before this, the app's configuration existed
# only in Slack's UI, so there was nothing to restore from.
#
# Refresh it by hand (api.slack.com -> Uno-bot -> App Manifest -> YAML) after any
# deliberate config change. Pasting it back REPLACES the whole manifest, so read
# the diff first; additive changes are safer made through the feature pages.
#
# ── IN SYNC WITH LIVE (verified `npm run slack:diff`, 2026-08-06) ────────────
# `messages_tab_enabled: true` and the `app_context_changed` subscription are
# both applied on the app now, and the handlers for the agent surface shipped
# with them:
#
#   app_home_opened (tab: "messages")  -> handleAgentDmOpened     — agent_view's
#     replacement for assistant_thread_started; refreshes suggested prompts.
#   app_context_changed                -> handleAppContextChanged — replacement
#     for assistant_thread_context_changed; stores the "what you're looking at"
#     grounding under the DM conversation key.
#
# The legacy pair (assistant_thread_started, assistant_thread_context_changed)
# is GONE as of 2026-08-06 — unsubscribed here and deleted from src/slack/. The
# migration to agent_view is complete and irreversible by Slack's own design, so
# there is no configuration these would serve. An arrival now would be a
# Slack-side surprise, and shows up in the unhandled-event log.
#
# ⚠️ Event-subscription changes do NOT apply from this file. pkce_enabled makes
# apps.manifest.update reject every payload, so the manifest editor is dead for
# this app — edit subscriptions on the Event Subscriptions page instead, then
# confirm with `npm run slack:diff`.
#
# ── SCOPE: THIS CHANGES DMs ONLY ─────────────────────────────────────────────
# agent_view governs the app's own DM / Messages surface. Channels are
# untouched: an @mention still opens a thread and the bot still answers inside
# it, the emoji proposal gate still keys off the reacted message, and a /uno-*
# slash command still posts a framing message and threads its run beneath.
#
# In the DM the conversation model changes by design — chat, not threads — so
# the DM channel itself is the conversation rather than each thread within it.
# That is a code decision (the runner key and history load branch on
# channel_type), recorded here because the manifest is what commits to it.
#
# ── KNOWN-WRONG, DELIBERATELY UNCHANGED ──────────────────────────────────────
# (interactivity is FIXED, not known-wrong: the request_url pointed at a Netlify
# function that never existed. It now points at the Worker's /slack/interactive
# route. This is the third intentional difference from live.)
#
# (messages_tab_enabled moved above — it is now an intended change, not a
# question, since the DM is meant to read as an ordinary chat.)
display_information:
  # App NAME stays "Uno-bot" — this is what App Directory search matches, so it
  # is how people still find the bot by its old name. The bot USER's display
  # name is "Le Goat" (features.bot_user below), which is what appears on every
  # message. Slack has no separate handle field: the @mention follows
  # display_name, so it is now @le goat.
  name: Uno-bot
  description: PLUS design team's Slack-native AI teammate
  # long_description was never set on the app (confirmed absent from
  # apps.manifest.export, 2026-08-06) — the App Directory entry has been blank
  # since day one. Max 4000 chars; only shows once the app is submitted/listed.
  long_description: |-
    UNO Bot is the PLUS design team's Slack-native teammate. It answers from live sources rather than memory — Notion (Roadmap cards, PRDs, the team and app directories), GitHub, the service blueprint, the design system, and Slack itself — and every answer carries links back to what it read.

    What it does:
    • Answers, grounded. Card status, owner and pillar; how a product flow actually works; which design-system components and tokens exist and where their docs live. If something is stale, missing, or not built yet, it says so instead of guessing.
    • Creates, with your approval. Drafts a PRD, files or updates a Roadmap card, kicks off a component build or a prototype, shares work for feedback. Anything that writes waits for your ✅ first — the friction is the feature.
    • Hands off. Work that needs real code comes back as a ready-to-paste prompt for your IDE agent.

    Reach it by DM, by @mention in a channel, in a thread it is already part of, or through the /uno-* slash commands (research, synthesize, prototype, review, publish, maintain).

    Searching Slack runs on your own credentials once you link them, so results are scoped to what you can already see. Until then it searches public channels only. Nothing retrieved is stored: metadata is kept, content is re-read live each time.
  background_color: "#1f1f1f"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Le Goat
    always_online: true
  slash_commands:
    - command: /uno-prototype
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Turn a PRD into a design artifact at the fidelity you pick, grounded on the blueprint
      usage_hint: "[prd-required] [fidelity]"
      should_escape: false
    - command: /uno-research
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Gather context that doesn't exist yet — evidence sweeps, study guides, discovery
      usage_hint: "[question / hunch / who-knows-X]"
      should_escape: false
    - command: /uno-synthesize
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Distill gathered context into findings, takeaways, and — on your go — a PRD
      usage_hint: '[sources-to-distill | "draft the PRD"]'
      should_escape: false
    - command: /uno-review
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: "Diagnose-only design review: design-system, product-intent, and accessibility lenses"
      usage_hint: "[artifact + manifest (fidelity / tools / PRD link)]"
      should_escape: false
    - command: /uno-publish
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Share finished-enough work for feedback, or hand it off to development
      usage_hint: "[prototype-or-project]"
      should_escape: false
    - command: /uno-maintain
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: File an intake, run a standing sweep, or capture a lesson into the harness
      usage_hint: "[intake / sweep-name / lesson-to-capture]"
      should_escape: false
  agent_view:
    agent_description: "Your 🐐 PLUS design teammate: I pull live, cited answers on roadmap cards, product flows, and design-system assets across Notion, Figma, and Slack. I flag anything outdated or unbuilt, and can draft PRDs, update cards, or start prototypes—with your approval first."
    suggested_prompts: []
oauth_config:
  redirect_urls:
    - https://uno-bot.bryanhuang628.workers.dev/oauth/slack/callback
  scopes:
    user:
      - canvases:read
      - canvases:write
      - channels:history
      - channels:read
      - channels:write
      - chat:write
      - emoji:read
      - files:read
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - reactions:read
      - reactions:write
      - search:read.files
      - search:read.im
      - search:read.mpim
      - search:read.private
      - search:read.public
      - search:read.users
      - users:read
      - users:read.email
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - bookmarks:write
      - calls:read
      - canvases:read
      - canvases:write
      - channels:history
      - channels:read
      - channels:write.topic
      - chat:write
      - chat:write.customize
      - chat:write.public
      - commands
      - emoji:read
      - files:read
      - files:write
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:write
      - incoming-webhook
      - links.embed:write
      - mcp:connect
      - metadata.message:read
      - mpim:history
      - reactions:read
      - reactions:write
      - search:read.files
      # search:read.im / .mpim / .private are DELIBERATELY ABSENT from the BOT
      # block. A bot token's visibility is the BOT's own membership — not the
      # requesting user's — and the bot is a participant in every user's DM with
      # itself. Granting them would let a bot-token search surface one person's
      # DM with uno-bot in answer to someone else's question, routing around the
      # own-DM surface gate that ADR-020 exists to enforce. They remain on the
      # USER block below, where a token can only ever see its own owner's
      # conversations. Nothing in the Worker searches with a bot token today.
      - search:read.public
      - search:read.users
      - team:read
      - users.profile:read
      - users:read
      - users:read.email
  pkce_enabled: true
settings:
  event_subscriptions:
    request_url: https://uno-bot.bryanhuang628.workers.dev/slack/events
    bot_events:
      - app_context_changed
      - app_home_opened
      - app_mention
      - emoji_changed
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
    # Repointed from a Netlify function that never existed (confirmed 404) to the
    # Worker, which already owns every other Slack surface and already has the
    # signature verification and the DO enqueue path an interaction needs.
    request_url: https://uno-bot.bryanhuang628.workers.dev/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: true

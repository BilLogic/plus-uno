name: uno-bot — Worker checks

# The Worker's own typecheck, its own unit suite and its Durable Object
# conformance suite, each as a PULL-REQUEST CHECK WITH ITS OWN NAME (#580,
# #587).
#
# WHAT THIS DOES AND DOES NOT ADD. Both commands already ran on every pull
# request before this file existed: `typecheck` and `test` are rows of
# `scripts/checks.registry.mjs` with `trigger: 'pull_request'`, composed into
# `npm run check:harness` since 2026-08-29, and `check-harness.yml` runs that
# composite. What was missing is the part a reviewer reads. The whole composite
# lands on one GitHub check named `check:harness / harness`, so a type error and
# a failing test are the same red line in the PR's check list, and telling them
# apart means opening a 40-second log. Three named jobs answer the question from
# the list: "uno-bot — Worker checks / typecheck", "… / tests" and
# "… / conformance".
#
# THE REGISTRY ROWS STAY COMPOSED, so the two commands run twice on a PR: once
# inside the composite, once here. That is deliberate and it is the cheaper of
# the two mistakes. `npm run check:harness` is the one command this repo asks
# for before opening a PR (docs/engineering/setup.md § The harness gate), and a
# local gate that is a strict SUBSET of the remote one is what cost #388 a red
# CI — a rewording that passed 38 green sub-checks locally and failed only after
# the push. Dropping the rows here to save 3.4s of runner time would rebuild
# exactly that gap. The duplicate work is 1.2s of `tsc` and 2.2s of `node --test`
# (measured 2026-09-17), inside two jobs whose real cost is the install, and both
# run concurrently with the harness job, so a PR's wall clock is unchanged.
#
# NO SECRET, BY CONSTRUCTION, which is what lets a fork PR run it. `tsc` reads
# the checkout. The suite is `node --test` over compiled TypeScript: pure
# functions, mocked `fetch`, and a few files read off disk — no Worker, no
# Cloudflare token, no model call and no spend. The conformance job is the same:
# workerd runs LOCALLY on the runner, from the `wrangler` already in
# devDependencies, against a Durable Object namespace miniflare creates in a
# temporary directory. Nothing it touches is an account resource, so a fork PR
# runs all three.
#
# WHERE THE CONFORMANCE SUITE BELONGS, AND WHY IT IS HERE RATHER THAN A ROW OF
# THE FAST GATE. It was a hand-written step of `check-harness.yml` from #493
# until #587, which made it gated but illegible: 48 sub-checks plus that step
# land on one GitHub check, so "the Durable Object broke" and "a doc link broke"
# were the same red line. The two candidates #587 weighed, both measured:
#
#   - COMPOSE IT INTO `check:harness`. Rejected on the number that gate is
#     defended by. `npm run check:harness` is the command this repo asks for
#     before a push, and 4.5s cold / 3.1s warm on a 14s composite is a third
#     again on the thing everyone waits for — and it is startup, not assertions:
#     vitest reports 1.7s for the run, 1.05s of it the import. It would also put
#     a RUNTIME inside a gate whose stated rule is that every member runs on a
#     clean checkout in seconds, and it would leave the red exactly as illegible
#     as the step it replaced.
#
#   - ITS OWN NAMED JOB, HERE. Chosen. The suite's 4s (measured as a step of the
#     harness job, run 35277835410) moves off a 40s job — which measures 34s
#     without it, run 35279458463 — and into a job that runs CONCURRENTLY with
#     it, so a PR's wall clock falls rather than rises, and the check list gains
#     a line that says which thing broke. This job itself is 26s: 13s of install,
#     5s of suite, the rest checkout and setup (same run, all 2026-09-17). This is the same trade `check:storybook` records making
#     for the browser suite, two orders of magnitude cheaper.
#
# UNLIKE `typecheck` AND `test`, THIS ROW IS NOT COMPOSED — so the suite runs
# ONCE on a pull request, here. The duplicate-work argument above turns on
# `check:harness` being the pre-push command and therefore needing to be a
# superset; `test:workerd` was outside that composite before this change and
# stays outside it, so there is no subset to protect. Its registry row
# (scripts/checks.registry.mjs § EXCLUDED) carries that reasoning and the
# measured numbers.
#
# NOT PATHS-FILTERED, on the same reasoning as `check-harness.yml` and
# `uno-bot-deploy.yml`: `tests/harness-blueprint-names.test.ts` reads the
# assembled prompt, the tool schemas and the Actions prompts under
# `scripts/prompts/`, so a PR that touches nothing under `agents/` can turn this
# suite red — and a filter narrow enough to save an install is a filter that
# misses that.
#
# WHY THREE JOBS RATHER THAN THREE STEPS OF ONE. A GitHub check is a JOB; steps
# are log lines inside one. Three steps would put the type failure, the test
# failure and the conformance failure back on a single red check, which is the
# thing this file exists to fix. The price is three installs instead of one, and
# they are concurrent: the install is ~13s of a job whose commands are seconds.
#
# Spot-run: `gh workflow run uno-bot-checks.yml`.

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # A superseded push to the same PR should cancel its in-flight run — the older
  # answer is about a tree that no longer exists.
  group: uno-bot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # The command is ~1.2s and the install is the rest. 10 lets a cold npm cache
    # through and still stops a hang from burning an hour.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          # Keyed on the Worker's own lockfile: this job installs nothing from
          # the root manifest, so the root lockfile changing should not miss the
          # cache and the Worker's changing must.
          cache: npm
          cache-dependency-path: agents/uno-bot/package-lock.json

      - name: Install uno-bot deps
        working-directory: agents/uno-bot
        run: npm ci

      # `tsc --noEmit` over agents/uno-bot/src/**, which is the whole Worker
      # surface (tsconfig.json § include). `npm run deploy` chains it too, so a
      # direct push to `main` still meets it — a gate that exists only on PRs is
      # a gate a direct push walks past.
      - name: npm run typecheck
        working-directory: agents/uno-bot
        run: npm run typecheck

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: agents/uno-bot/package-lock.json

      - name: Install uno-bot deps
        working-directory: agents/uno-bot
        run: npm ci

      # `tsc -p tsconfig.test.json && node --test .test-build/tests/*.test.js` —
      # the largest unit suite in this repository. It is
      # also part of `npm run deploy` as of #580, for the direct-push reason
      # above: before that, this suite ran on pull requests and nowhere else, so
      # a push straight to `main` reached production having run none of it.
      - name: npm test
        working-directory: agents/uno-bot
        run: npm test

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: agents/uno-bot/package-lock.json

      - name: Install uno-bot deps
        working-directory: agents/uno-bot
        run: npm ci

      # `vitest run --config vitest.workerd.config.mts` — 49 cases from one
      # shared conformance body (tests/helpers/thread-state-conformance.ts),
      # here against a real Durable Object over RPC on real DO SQLite. The same
      # body runs inside `npm test` against the in-memory adapter, so a red here
      # and a green there is the two store adapters disagreeing, which is the
      # single thing this suite is for. It is also part of `npm run deploy` as
      # of #587: `main` is unprotected, so a gate that lives only on pull
      # requests is a gate a direct push walks past.
      - name: npm run test:workerd
        working-directory: agents/uno-bot
        run: npm run test:workerd

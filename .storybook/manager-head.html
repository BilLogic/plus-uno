<!-- The app's families (--type-family-body, --type-family-code), as the preview loads them. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400..700&family=Noto+Sans+Mono:wght@400..500&display=swap" rel="stylesheet">

<style>
  /* Active story/docs row: its colors are the brand token pair, written per mode by manager.js. */
  .sidebar-container [data-selected='true'] {
    /* docs-literal: the manager has no token stylesheet; 6 and 4 are --radius-md and --radius-sm. */
    border-radius: 0.375rem;
  }

  .sidebar-container a[href]:hover,
  .sidebar-container button[role='treeitem']:hover {
    /* docs-literal: see above. */
    border-radius: 0.25rem;
  }

  /*
   * Remove Storybook TypeIcons (14×14) from layout, not just visibility — otherwise
   * Wrapper5 flex + gap:6 leaves an empty column for docs/story rows under folders.
   * Chevron lives in a sibling wrapper; it keeps normal flow.
   */
  .sidebar-container .sidebar-item
    :is(
      button,
      a[rel='canonical']:is(
        [href*='path=/story'],
        [href*='path=/docs'],
        [href*='path=/test']
      )
    )
    > div:first-child {
    position: relative;
  }

  .sidebar-container .sidebar-item
    :is(
      button,
      a[rel='canonical']:is(
        [href*='path=/story'],
        [href*='path=/docs'],
        [href*='path=/test']
      )
    )
    svg[viewBox='0 0 14 14'] {
    position: absolute !important;
    left: 0;
    top: 0;
    width: 0 !important;
    height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    overflow: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /*
   * Storybook pads a leaf row for its TypeIcon (14) as well as its depth. The icon is
   * out of layout above, so a leaf under a folder sat 14 right of where its depth puts
   * it, deeper than the folder rows beside it. Pull its content back by the icon's
   * width. A leaf straight under a top-level section keeps the gap: it already reads
   * as a child of the section label. Those sections are listed by id, so a new
   * top-level section with its own pages joins the list.
   */
  .sidebar-container .sidebar-item[data-nodetype='document']:not(
      :is(
        [data-parent-id='get-started'],
        [data-parent-id='patterns'],
        [data-parent-id='templates'],
        [data-parent-id='ai-ui'],
        [data-parent-id='data-visualizations'],
        [data-parent-id='libraries']
      )
    )
    > a
    > div:first-child {
    margin-left: -14px;
  }
</style>

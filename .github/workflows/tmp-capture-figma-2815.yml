name: TEMP capture figma 2815
on:
  push:
    branches: [cli/t2815]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Capture twice
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          mkdir -p cap
          cat > "$RUNNER_TEMP/capture.mjs" <<'JS'
          import fs from 'node:fs';
          const { figmaGet, waitBudget, rowsFrom, DEFAULT_FILE_KEY, NODES_SPACING_MS } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/snapshot-figma-components.mjs`);
          const [n] = process.argv.slice(2);
          const token = process.env.FIGMA_ACCESS_TOKEN;
          const budget = waitBudget();
          const get = (e) => figmaGet(e, token, { budget });
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const components = await get(`/files/${DEFAULT_FILE_KEY}/components`);
          const versions = await get(`/files/${DEFAULT_FILE_KEY}/versions`);
          const rows = rowsFrom(components);
          const bySet = new Map();
          for (const r of rows) if (r.containingFrame) bySet.set(r.containingFrame, [...(bySet.get(r.containingFrame) ?? []), r.nodeId]);
          const nodes = { nodes: {} };
          let sel;
          if (n === '1') {
            const cands = [...bySet.entries()].filter(([, v]) => v.length >= 2 && v.length <= 8).slice(0, 14);
            sel = [];
            for (const [name, ids] of cands) {
              if (sel.length === 5) break;
              if (sel.length + 1 > 0 && (sel.length || nodes.__started)) await sleep(NODES_SPACING_MS);
              nodes.__started = true;
              const r = await get(`/files/${DEFAULT_FILE_KEY}/nodes?ids=${ids.join(',')}&geometry=paths`);
              const size = JSON.stringify(r).length;
              console.log(`set candidate ${name}: ${ids.length} ids, ${size} bytes`);
              if (size > 250_000) continue;
              sel.push({ name, ids });
              Object.assign(nodes.nodes, r.nodes);
            }
            delete nodes.__started;
            fs.writeFileSync('cap/selection.json', JSON.stringify(sel));
          } else {
            sel = JSON.parse(fs.readFileSync('cap/selection.json', 'utf8'));
            for (const [i, { ids }] of sel.entries()) {
              if (i > 0) await sleep(NODES_SPACING_MS);
              Object.assign(nodes.nodes, (await get(`/files/${DEFAULT_FILE_KEY}/nodes?ids=${ids.join(',')}&geometry=paths`)).nodes);
            }
          }
          const ids = sel.flatMap((x) => x.ids);
          fs.writeFileSync(`cap/components-${n}.json`, JSON.stringify(components));
          fs.writeFileSync(`cap/versions-${n}.json`, JSON.stringify(versions));
          fs.writeFileSync(`cap/nodes-${n}.json`, JSON.stringify(nodes));
          console.log(`capture ${n} done: ${ids.length} ids`);
          JS
          node "$RUNNER_TEMP/capture.mjs" 1
          sleep 75
          node "$RUNNER_TEMP/capture.mjs" 2
      - uses: actions/upload-artifact@v4
        with:
          name: figma-captures
          path: cap/
          retention-days: 1

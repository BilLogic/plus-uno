# Throwaway: read-only probe of Figma API shapes for FIGMA_ACCESS_TOKEN. Never merged.
# GETs only. Prints status codes, counts, field names and rate-limit header
# names, never comment text, handles or emails.
name: figma-api-facts-probe
on:
  pull_request:
    paths: [".github/workflows/figma-api-facts-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          T: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          F: ${{ secrets.FIGMA_FILE_KEY }}
          TEAM: "1279226364199713409"
        run: |
          node - <<'JS'
          const { T, F, TEAM } = process.env;
          const h = { "X-Figma-Token": T };
          const keysOf = (o) => (o && typeof o === "object" ? Object.keys(o).sort().join(",") : typeof o);
          const union = (arr, pick = (x) => x) => {
            const s = new Set();
            for (const x of arr) { const v = pick(x); if (v && typeof v === "object") Object.keys(v).forEach((k) => s.add(k)); }
            return [...s].sort().join(",");
          };
          async function get(path) {
            const r = await fetch("https://api.figma.com" + path, { headers: h });
            const hdr = [...r.headers.keys()].filter((k) => /rate|retry|limit|figma|plan/i.test(k)).map((k) => /plan|tier|type/i.test(k) ? `${k}=${r.headers.get(k)}` : k).join(",");
            let j = null; const text = await r.text();
            try { j = JSON.parse(text); } catch {}
            return { status: r.status, j, hdr, text };
          }
          const out = (name, r, note) => console.log(`${String(r.status).padEnd(4)} ${name} — ${r.status < 300 ? note : String(r.j?.err || r.j?.message || r.text).slice(0, 300)}${r.hdr ? `  [headers: ${r.hdr}]` : ""}`);

          // Q1. folders (v2) and projects (v1)
          let r = await get(`/v2/teams/${TEAM}/folders`);
          const folders = r.j?.folders ?? r.j?.projects ?? [];
          out("GET /v2/teams/:id/folders", r, `top keys=${keysOf(r.j)}; folders=${folders.length}; folder keys=${union(folders)}`);
          const folderId = folders[0]?.id;
          r = await get(`/v1/teams/${TEAM}/projects`);
          out("GET /v1/teams/:id/projects", r, `top keys=${keysOf(r.j)}; projects=${r.j?.projects?.length}; project keys=${union(r.j?.projects ?? [])}`);
          const projectId = folderId ?? r.j?.projects?.[0]?.id;
          if (projectId) {
            r = await get(`/v2/folders/${projectId}/files`); out("GET /v2/folders/:id/files", r, `top keys=${keysOf(r.j)}; files=${r.j?.files?.length}; file keys=${union(r.j?.files ?? [])}`);
            r = await get(`/v1/projects/${projectId}/files`); out("GET /v1/projects/:id/files", r, `top keys=${keysOf(r.j)}; files=${r.j?.files?.length}; file keys=${union(r.j?.files ?? [])}`);
          }

          // Q3. webhooks on the team
          r = await get(`/v2/webhooks?context=team&context_id=${TEAM}`);
          out("GET /v2/webhooks?context=team", r, `top keys=${keysOf(r.j)}; webhooks=${r.j?.webhooks?.length}; webhook keys=${union(r.j?.webhooks ?? [])}; types=${(r.j?.webhooks ?? []).map((w) => w.event_type + "/" + w.status).join(",")}`);
          r = await get(`/v2/webhooks`);
          out("GET /v2/webhooks (no context: all for this token's plan)", r, `top keys=${keysOf(r.j)}; webhooks=${r.j?.webhooks?.length}`);

          // Q4. dev resources on the DS file
          r = await get(`/v1/files/${F}/dev_resources`);
          const drs = r.j?.dev_resources ?? [];
          const perNode = {}; for (const d of drs) perNode[d.node_id] = (perNode[d.node_id] ?? 0) + 1;
          out("GET /v1/files/:key/dev_resources", r, `top keys=${keysOf(r.j)}; count=${drs.length}; entry keys=${union(drs)}; max per node=${Math.max(0, ...Object.values(perNode))}`);

          // Q5. comments on the DS file (shape and counts only)
          r = await get(`/v1/files/${F}/comments`);
          const cs = r.j?.comments ?? [];
          out("GET /v1/files/:key/comments", r,
            `top keys=${keysOf(r.j)}; count=${cs.length}; comment keys=${union(cs)}; user keys=${union(cs, (c) => c.user)}; ` +
            `client_meta keys=${union(cs, (c) => c.client_meta)}; client_meta.node_offset keys=${union(cs, (c) => c.client_meta?.node_offset)}; ` +
            `replies(parent_id set)=${cs.filter((c) => c.parent_id).length}; replies with client_meta=${cs.filter((c) => c.parent_id && c.client_meta).length}; ` +
            `top-level with node_id=${cs.filter((c) => !c.parent_id && c.client_meta?.node_id).length}; resolved=${cs.filter((c) => c.resolved_at).length}; ` +
            `distinct authors=${new Set(cs.map((c) => c.user?.id)).size}`);

          // Q2 context. versions shape
          r = await get(`/v1/files/${F}/versions?page_size=5`);
          out("GET /v1/files/:key/versions", r, `top keys=${keysOf(r.j)}; version keys=${union(r.j?.versions ?? [])}; user keys=${union(r.j?.versions ?? [], (v) => v.user)}`);

          // Q6. rate-limit headers on a cheap call
          r = await get(`/v1/me`);
          out("GET /v1/me (headers only)", r, `me keys=${keysOf(r.j)}`);
          JS

# Uno-bot Slack app manifest — app A0APS0L8HJR, CMU Simon Initiative workspace.
#
# Captured from api.slack.com on 2026-08-04, after the six /uno-* slash commands
# were created. Hand-maintained: nothing generates or applies this file. It is
# the repo's record of what production actually runs on, and the rollback point
# if a manifest save goes wrong — before this, the app's configuration existed
# only in Slack's UI, so there was nothing to restore from.
#
# Refresh it by hand (api.slack.com -> Uno-bot -> App Manifest -> YAML) after any
# deliberate config change. Pasting it back REPLACES the whole manifest, so read
# the diff first; additive changes are safer made through the feature pages.
#
# ── IN SYNC WITH LIVE (verified `npm run slack:diff`, 2026-08-06) ────────────
# `messages_tab_enabled: true` and the `app_context_changed` subscription are
# both applied on the app now, and the handlers for the agent surface shipped
# with them:
#
#   app_home_opened (tab: "messages")  -> handleAgentDmOpened     — agent_view's
#     replacement for assistant_thread_started; refreshes suggested prompts.
#   app_context_changed                -> handleAppContextChanged — replacement
#     for assistant_thread_context_changed; stores the "what you're looking at"
#     grounding under the DM conversation key.
#
# The legacy pair (assistant_thread_started, assistant_thread_context_changed)
# is GONE as of 2026-08-06 — unsubscribed here and deleted from src/slack/. The
# migration to agent_view is complete and irreversible by Slack's own design, so
# there is no configuration these would serve. An arrival now would be a
# Slack-side surprise, and shows up in the unhandled-event log.
#
# ⚠️ The API cannot apply this file; the WEB EDITOR can. pkce_enabled makes
# apps.manifest.update / .validate reject every payload — including Slack's own
# unmodified export — so `slack manifest sync` and any scripted push fail with
# cannot_disable_once_enabled. Pasting the same YAML into the App Manifest page
# saves fine (verified 2026-08-06). So: paste by hand, then confirm with
# `npm run slack:diff`.
#
# ── SCOPE: THIS CHANGES DMs ONLY ─────────────────────────────────────────────
# agent_view governs the app's own DM / Messages surface. Channels are
# untouched: an @mention still opens a thread and the bot still answers inside
# it, the emoji proposal gate still keys off the reacted message, and a /uno-*
# slash command still posts a framing message and threads its run beneath.
#
# DM replies are THREADED (changed 2026-08-06, reversing 74f1b17c's "chat, not
# threads"). Both thinking-indicator mechanisms Slack offers —
# assistant.threads.setStatus and chat.startStream — require a thread_ts, so a
# threadless DM could never show one. Slack's own agent experience threads for
# the same reason: "threads shown in a timeline above the composer".
#
# Continuity is unchanged: the user types in the composer, so their next message
# still arrives unthreaded and conversationTs() resolves every DM line to the
# single DM_CONVERSATION key.
#
# ── KNOWN-WRONG, DELIBERATELY UNCHANGED ──────────────────────────────────────
# (interactivity: RESOLVED, and no longer a difference from live. The
# request_url once pointed at a Netlify function that never existed; it now
# points at the Worker's /slack/interactive route BOTH here and on the app.
# Verified 2026-08-22: `slack manifest diff --app A0APS0L8HJR` reports
# "Project manifest and app settings match", and the remote manifest's
# settings.interactivity.request_url reads the Worker URL. The older wording
# here — "this is the third intentional difference from live" — was stale, and
# on 2026-08-22 it was read as "the ✅/⛔ buttons need a human to apply the
# manifest", which was wrong. Re-run the diff before believing this header.)
#
# (messages_tab_enabled moved above — it is now an intended change, not a
# question, since the DM is meant to read as an ordinary chat.)
display_information:
  # ── TWO NAMES, AND THEY GOVERN DIFFERENT SURFACES ──────────────────────────
  # This one (display_information.name) is what shows in the SIDEBAR, the DM
  # header, the Messages/Home tab title, workspace search, and the App
  # Directory. features.bot_user.display_name ("le goat") is what shows as the
  # AUTHOR on every message the bot posts. Slack derives the @handle from
  # display_name, so the mention is @le goat.
  #
  # Reinstalling propagates display_name to the bot user. It CANNOT change this
  # field — so "I reinstalled and it still says Uno-bot" is the expected
  # outcome, not a failed install. That confusion has now cost two rounds; this
  # comment exists so it does not cost a third.
  #
  # Staying "Uno-bot" is a DECISION, re-confirmed 2026-08-07: search matches on
  # the name, and this is the name the team already types to find the app.
  name: Uno-bot
  description: PLUS team's Slack-native AI teammate 🐐
  # long_description was never set on the app (confirmed absent from
  # apps.manifest.export, 2026-08-06) — the App Directory entry has been blank
  # since day one. Max 4000 chars; only shows once the app is submitted/listed.
  long_description: |-
    UNO Bot is the PLUS design team's Slack-native teammate. It answers from live sources rather than memory — Notion (Roadmap cards, PRDs, the team and app directories), GitHub, the service blueprint, the design system, and Slack itself — and every answer carries links back to what it read.

    What it does:
    • Answers, grounded. Card status, owner and pillar; how a product flow actually works; which design-system components and tokens exist and where their docs live. If something is stale, missing, or not built yet, it says so instead of guessing.
    • Creates, with your approval. Drafts a PRD, files or updates a Roadmap card, kicks off a component build or a prototype, shares work for feedback. Anything that writes waits for your ✅ first — the friction is the feature.
    • Hands off. Work that needs real code comes back as a ready-to-paste prompt for your IDE agent.

    Reach it by DM, by @mention in a channel, in a thread it is already part of, or through the /uno-* slash commands (research, synthesize, prototype, review, publish, maintain).

    Searching Slack runs on your own credentials once you link them, so results are scoped to what you can already see. Until then it searches public channels only. Nothing retrieved is stored: metadata is kept, content is re-read live each time.
  background_color: "#1f1f1f"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: le goat
    always_online: true
  shortcuts:
    # Message shortcuts (context menu on a message). The LABEL lives here; the
    # question each one asks lives in src/slack/shortcut-specs.ts, so the wording is
    # reviewable in a diff rather than buried in app settings. A test asserts
    # these callback_ids match the handler — a shortcut declared with no entry
    # there still appears in the menu and quietly does the generic thing.
    #
    # ORDER MATTERS TWICE. It is the order they appear in the context menu, and
    # `slack manifest diff` compares the list positionally — so a set that
    # matches in a different order still reports a difference forever. A diff
    # that always shows one difference is a diff nobody reads. This order is
    # the app's (verified in sync 2026-08-07); keep them equal.
    - name: Catch me up from here
      type: message
      callback_id: catchup
      description: What was decided, what's open, who owns what
    - name: Where was this decided?
      type: message
      callback_id: where_decided
      description: Find the decision's origin, or say there is no record
    - name: Help me reply
      type: message
      callback_id: draft
      description: A draft in your voice, for you to send
    - name: Think harder about this
      type: message
      callback_id: grind
      description: Redo it properly on the deep tier
    - name: Is this still true?
      type: message
      callback_id: verify
      description: Check the claim against the blueprint and Notion
  slash_commands:
    - command: /uno-prototype
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Turn a PRD into a design artifact at the fidelity you pick, grounded on the blueprint
      usage_hint: "[prd-required] [fidelity]"
      should_escape: false
    - command: /uno-research
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Gather context that doesn't exist yet — evidence sweeps, study guides, discovery
      usage_hint: "[question / hunch / who-knows-X]"
      should_escape: false
    - command: /uno-synthesize
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Distill gathered context into findings, takeaways, and — on your go — a PRD
      usage_hint: '[sources-to-distill | "draft the PRD"]'
      should_escape: false
    - command: /uno-review
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: "Diagnose-only design review: design-system, product-intent, and accessibility lenses"
      usage_hint: "[artifact + manifest (fidelity / tools / PRD link)]"
      should_escape: false
    - command: /uno-publish
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Share finished-enough work for feedback, or hand it off to development
      usage_hint: "[prototype-or-project]"
      should_escape: false
    - command: /grind
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Run this question harder — deep model, checks the claims
      usage_hint: "[your question]"
      should_escape: false
    - command: /chill
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Run this question cheap and short
      usage_hint: "[your question]"
      should_escape: false
    - command: /stop
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: Stop the turn I'm working on right now
      usage_hint: "[no arguments]"
      should_escape: false
    - command: /uno-maintain
      url: https://uno-bot.bryanhuang628.workers.dev/slack/commands
      description: File an intake, run a standing sweep, or capture a lesson into the harness
      usage_hint: "[intake / sweep-name / lesson-to-capture]"
      should_escape: false
  agent_view:
    agent_description: "Your 🐐 PLUS design teammate: I pull live, cited answers on roadmap cards, product flows, and design-system assets across Notion, Figma, and Slack. I flag anything outdated or unbuilt, and can draft PRDs, update cards, or start prototypes—with your approval first."
    # Static fallback chips, shown before the Worker's setSuggestedPrompts call
    # lands (handleAgentDmOpened). Empty meant a cold open showed nothing until
    # the API round-tripped. Keep in sync with SUGGESTED_PROMPTS in
    # src/slack/assistant.ts — same four, same wording.
    suggested_prompts:
      - title: "What's in progress?"
        message: "What design cards are currently in progress on the Roadmap?"
      - title: "Look up a component"
        message: "Does the design system have a Badge component, and where are its docs?"
      - title: "Who should I ask?"
        message: "Who's the right person to talk to about goal-setting?"
      - title: "Draft a PRD"
        message: "Help me draft a PRD for a new feature idea."
oauth_config:
  redirect_urls:
    - https://uno-bot.bryanhuang628.workers.dev/oauth/slack/callback
  scopes:
    user:
      - canvases:read
      - canvases:write
      - channels:history
      - channels:read
      - channels:write
      - chat:write
      - emoji:read
      - files:read
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - reactions:read
      - reactions:write
      - search:read.files
      - search:read.im
      - search:read.mpim
      - search:read.private
      - search:read.public
      - search:read.users
      - users:read
      - users:read.email
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - bookmarks:write
      - calls:read
      - canvases:read
      - canvases:write
      - channels:history
      - channels:read
      - channels:write.topic
      - chat:write
      - chat:write.customize
      - chat:write.public
      - commands
      - emoji:read
      - files:read
      - files:write
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:write
      - incoming-webhook
      - links.embed:write
      - mcp:connect
      - metadata.message:read
      - mpim:history
      - reactions:read
      - reactions:write
      - search:read.files
      # search:read.im / .mpim / .private are DELIBERATELY ABSENT from the BOT
      # block. A bot token's visibility is the BOT's own membership — not the
      # requesting user's — and the bot is a participant in every user's DM with
      # itself. Granting them would let a bot-token search surface one person's
      # DM with uno-bot in answer to someone else's question, routing around the
      # own-DM surface gate that ADR-020 exists to enforce. They remain on the
      # USER block below, where a token can only ever see its own owner's
      # conversations. Nothing in the Worker searches with a bot token today.
      - search:read.public
      - search:read.users
      - team:read
      - users.profile:read
      - users:read
      - users:read.email
  pkce_enabled: true
settings:
  event_subscriptions:
    request_url: https://uno-bot.bryanhuang628.workers.dev/slack/events
    bot_events:
      - app_context_changed
      - app_home_opened
      - app_mention
      - emoji_changed
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
    # Repointed from a Netlify function that never existed (confirmed 404) to the
    # Worker, which already owns every other Slack surface and already has the
    # signature verification and the DO enqueue path an interaction needs.
    request_url: https://uno-bot.bryanhuang628.workers.dev/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: true

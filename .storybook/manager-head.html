<style>
  /* Active story/docs row: the brand token pair, set per mode on <html> by manager.js */
  .sidebar-container [data-selected='true'] {
    border-radius: 0.375rem;
    background-color: var(--plus-manager-selected-bg) !important;
    color: var(--plus-manager-selected-fg) !important;
  }

  .sidebar-container [data-selected='true'] svg {
    color: var(--plus-manager-selected-fg) !important;
    opacity: 0.95;
  }

  .sidebar-container a[href]:hover,
  .sidebar-container button[role='treeitem']:hover {
    border-radius: 0.25rem;
  }

  /*
   * Remove Storybook TypeIcons (14×14) from layout, not just visibility — otherwise
   * Wrapper5 flex + gap:6 leaves an empty column for docs/story rows under folders.
   * Chevron lives in a sibling wrapper; it keeps normal flow.
   */
  .sidebar-container .sidebar-item
    :is(
      button,
      a[rel='canonical']:is(
        [href*='path=/story'],
        [href*='path=/docs'],
        [href*='path=/test']
      )
    )
    > div:first-child {
    position: relative;
  }

  .sidebar-container .sidebar-item
    :is(
      button,
      a[rel='canonical']:is(
        [href*='path=/story'],
        [href*='path=/docs'],
        [href*='path=/test']
      )
    )
    svg[viewBox='0 0 14 14'] {
    position: absolute !important;
    left: 0;
    top: 0;
    width: 0 !important;
    height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    overflow: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
</style>

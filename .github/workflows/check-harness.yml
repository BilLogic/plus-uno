name: check:harness

# The repo's first `pull_request` gate. Everything it runs is composed in
# `scripts/check-harness.mjs`, which is also where the reasons for the set live —
# never restate the composition here, or the two lists drift and the workflow
# becomes the lie.
#
# WHY A PR TRIGGER AND NOT ANOTHER CRON. Every other workflow here is `schedule`,
# `repository_dispatch` or `push`, and all three observe a branch only once it is
# `main`. Two branches each green alone and red together are undetectable until
# the damage is merged — observed 2026-08-26, when #172 and #193 merged in
# sequence and left `main` with a stale INDEX.md and harness-bundle.md, four
# checks red, repaired afterwards by #196. `pull_request` runs against the merge
# commit GitHub builds from the head and the base, so that pair would have been
# caught on the second PR rather than on main.
#
# TWO INSTALLS, BOTH SCOPED. Neither is a root `npm ci` of every devDependency.
#   1. `npm ci` in `agents/uno-bot` (14–15s), which the step below explains.
#   2. The stylesheet parser `check:focus-ring` and `check:text-contrast` read
#      `@grounds` and `@contrast` with: postcss, postcss-scss and
#      postcss-selector-parser plus their transitive dependencies, each at the
#      version package-lock.json resolves, into the runner's temp directory and
#      linked into `node_modules` (0–1s). What it buys: those two checks and
#      their tests in `test:scripts` can run at all.
# This header read "EXACTLY ONE `npm ci`" and 34–38s until the second install
# landed, and before that "NO `npm ci`, DELIBERATELY" for three weeks after the
# first one did — a file arguing for a number forty lines above the step that
# changed it, twice. So the figure is re-measured rather than carried: the job
# is 64–69s, of which the composite is 38–42s (runs 36616445040, 36617289152
# and 36618392737, 2026-09-29). The second install is not where the time went
# since the 34–38s reading; the composite grew. Earlier measurements: run
# 35277835410 for 40s, runs 35279458463 and 35280023516 for 34s and 38s
# (2026-09-17), after #587 moved the 4s workerd step out to its own job, whose
# reason was legibility rather than seconds.
#
# The rule stands: a future sub-check that needs a package installs it in its
# own step and says what it bought, rather than growing a blanket `npm ci` at
# the root. A gate that costs ten minutes gets marked "not required" the first
# busy week. A sub-check that would need a RUNTIME goes further out still — to
# its own job, on its own name — which is what #587 decided for `test:workerd`
# and wrote up in `uno-bot-checks.yml`.
#
# NOT PATHS-FILTERED, for the same reason `uno-bot-deploy.yml` is not: the
# generated artifacts are assembled from docs/, skills/, design-system/ and the
# generators themselves, so a filter narrow enough to be worth having is a filter
# that misses the drift. The whole run is cheaper than reasoning about the filter.
#
# ONE CHECK FOR THE WHOLE COMPOSITE — and that is the limit of what a PR's check
# list can say about a red here. `uno-bot-checks.yml` runs the Worker's
# `typecheck`, its `test` suite and its `test:workerd` conformance suite as three
# SEPARATELY NAMED jobs for that reason (#580, #587): the first two are composed
# into the composite below and stay composed, so the pre-push command is whole,
# and the named jobs are what make a type failure legible apart from a test
# failure without opening this log. The third was never composed and is not a
# step here any more either — see the note where that step used to be.
#
# Spot-run: `gh workflow run check-harness.yml`.

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # A superseded push to the same PR should cancel its in-flight run — the older
  # answer is about a tree that no longer exists.
  group: check-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # BEFORE `check:harness`, not after, and the order is load-bearing:
      # that composite now runs the Worker's `typecheck` and its unit suite, and
      # both need this package's devDependencies. With the install below the
      # check, CI failed on `Cannot find type definition file for
      # '@cloudflare/workers-types'` while the same command passed on any
      # machine that had ever installed them — a guard that is green only where
      # it is not needed.
      #
      # `npm ci` is scoped to agents/uno-bot and these tests touch no network,
      # no credential and no Worker; they are pure functions plus two files read
      # off disk.
      - name: Install uno-bot deps
        working-directory: agents/uno-bot
        run: npm ci

      # The second scoped install (see the header). The three packages and
      # every package they depend on, each at the version package-lock.json
      # resolves, so nothing here is chosen by the registry on the day.
      # `--ignore-scripts`, because none of them needs an install script. The
      # link step refuses to replace anything already in `node_modules`: a
      # name there is a package this job did not expect, and shadowing it
      # would be a silent change of what the checks run against.
      - name: Install the stylesheet parser for the contrast checks
        run: |
          pins=$(node -e "
            const lock = require('./package-lock.json').packages;
            const pinned = new Map();
            const queue = ['postcss', 'postcss-scss', 'postcss-selector-parser'].map((name) => ['node_modules/' + name, name]);
            while (queue.length) {
              const [at, name] = queue.shift();
              // A dependency resolves where npm would: nested under its parent
              // first, then at the top level.
              const key = [at, 'node_modules/' + name].find((k) => lock[k]);
              if (!key) throw new Error(name + ' is not in package-lock.json');
              const { version, dependencies = {} } = lock[key];
              if (pinned.has(name)) {
                if (pinned.get(name) !== version) throw new Error('two versions of ' + name + ' in the lock; this step installs one');
                continue;
              }
              pinned.set(name, version);
              queue.push(...Object.keys(dependencies).map((dep) => [key + '/node_modules/' + dep, dep]));
            }
            console.log([...pinned].map(([name, version]) => name + '@' + version).join(' '));
          ")
          echo "Pinned: $pins"
          npm install --prefix "$RUNNER_TEMP/grounds" --no-save --no-audit --no-fund --ignore-scripts $pins
          mkdir -p node_modules
          for dir in "$RUNNER_TEMP"/grounds/node_modules/*; do
            name=$(basename "$dir")
            case " $pins " in
              *" $name@"*) ;;
              *) echo "::error::$name was installed but is not one of the pinned packages: $pins"; exit 1 ;;
            esac
            if [ -e "node_modules/$name" ] || [ -L "node_modules/$name" ]; then
              echo "::error::node_modules/$name already exists; refusing to replace it with the pinned $name"
              exit 1
            fi
            ln -s "$dir" "node_modules/$name"
          done

      # One command, one exit code. The composite names every sub-check that
      # failed and prints each one's own diagnostic underneath — it does not stop
      # at the first, so one run reports everything wrong with the branch.
      - name: npm run check:harness
        run: npm run check:harness

      # The bot's own script tests, which until now ran ONLY inside `npm run
      # deploy` — that is, after merge to main. So a broken eval fixture or a
      # drifted build-stamp derivation was caught while deploying rather than
      # while reviewing, and a docs edit could block a production deploy on a
      # sentence nobody had run the check against (#249).
      #
      - name: uno-bot script tests
        working-directory: agents/uno-bot
        run: npm run test:bundle

      # The eval suite through the local transport used to be spelled out here,
      # as its own step, while `npm run check:harness` did not run it — the
      # same local-is-a-subset-of-remote gap `test:bundle`'s registry row
      # records paying for. It is a composed row now (`evals:local`), so the
      # composite above runs it and this file no longer restates it. Its
      # reasons live with the row, per the rule at the top of this file.

      # The ThreadState conformance suite under workerd used to be spelled out
      # here too, from #493 until #587. It is still uncomposed — a runtime in
      # this gate is what the header above refuses — but it is a registry row
      # now (`test:workerd`, in EXCLUDED, with its reason and its numbers) and a
      # NAMED JOB of `uno-bot-checks.yml`, which runs concurrently with this one.
      # A Durable Object regression is a line in the check list that says so,
      # rather than a red `check:harness / harness` shared with 48 other
      # sub-checks. This job is a few seconds shorter for it, and that was never
      # the argument — see the header.

<!-- The app's families (--type-family-body, --type-family-code), as the preview loads them. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400..700&family=Noto+Sans+Mono:wght@400..500&display=swap" rel="stylesheet">

<style>
  /* Active story/docs row: the selected tokens (fill, text, 1px outline), written per mode by manager.js. */
  .sidebar-container [data-selected='true'] {
    /* docs-literal: the manager has no token stylesheet; 6 and 4 are --radius-md and --radius-sm. */
    border-radius: 0.375rem;
  }

  .sidebar-container a[href]:hover,
  .sidebar-container button[role='treeitem']:hover {
    /* docs-literal: see above. */
    border-radius: 0.25rem;
  }

  /*
   * Remove Storybook TypeIcons (14×14) from layout, not just visibility — otherwise
   * Wrapper5 flex + gap:6 leaves an empty column for docs/story rows under folders.
   * Chevron lives in a sibling wrapper; it keeps normal flow.
   */
  .sidebar-container .sidebar-item
    :is(
      button,
      a[rel='canonical']:is(
        [href*='path=/story'],
        [href*='path=/docs'],
        [href*='path=/test']
      )
    )
    > div:first-child {
    position: relative;
  }

  .sidebar-container .sidebar-item
    :is(
      button,
      a[rel='canonical']:is(
        [href*='path=/story'],
        [href*='path=/docs'],
        [href*='path=/test']
      )
    )
    svg[viewBox='0 0 14 14'] {
    position: absolute !important;
    left: 0;
    top: 0;
    width: 0 !important;
    height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    overflow: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /*
   * Storybook indents each depth by 18px and pads a leaf row for its TypeIcon, which is
   * out of layout above. A folder row's label sits after its chevron. Pull every leaf's
   * content back 6px so a leaf's label starts exactly where a folder's label at the same
   * depth starts: one label column per depth, chevrons hanging in the gutter.
   */
  .sidebar-container .sidebar-item:is([data-nodetype='document'], [data-nodetype='story'])
    > a
    > div:first-child {
    margin-left: -6px;
  }

  /*
   * Folder rows top-align their chevron (Storybook's align-items: start), which only
   * looks centred with Storybook's own shorter font. Noto Sans draws a 19px line box,
   * so the 8px chevron rode 3.5px above the label. Centre it on the label instead.
   */
  .sidebar-container .sidebar-item:is([data-nodetype='group'], [data-nodetype='component'])
    > button {
    align-items: center;
  }

  /* Storybook's own 2px nudge on the chevron wrapper assumed the top alignment. */
  .sidebar-container .sidebar-item:is([data-nodetype='group'], [data-nodetype='component'])
    > button
    > div:first-child {
    margin-top: 0;
  }
</style>

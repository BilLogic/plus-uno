# Throwaway: measures how closely files across the six PLUS Figma teams follow
# docs/connectors/figma.md. Read-only GETs only. Never merged.
# Prints aggregate counts, RM ids, and at most 5 example names per category.
# Never prints comment text, handles or emails.
name: figma-conventions-probe
on:
  pull_request:
    paths: [".github/workflows/figma-conventions-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Probe
        env:
          T: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          node - <<'JS'
          const T = process.env.T;
          const teams = {
            Universal: "1279226364199713409", Training: "1279227480162592555",
            Toolkit: "1279227565411025715", Admin: "1279229084983452695",
            Others: "1279227354789670676", MISC: "1279241534978917312",
          };
          const SAMPLE = 25, PACE_MS = 1500, NOW = Date.now(), DAY = 86400000;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          let calls = 0;
          async function get(p, tries = 0) {
            await sleep(PACE_MS); calls++;
            const r = await fetch("https://api.figma.com" + p, { headers: { "X-Figma-Token": T } });
            if (r.status === 429 && tries < 4) {
              const wait = Math.min(Number(r.headers.get("retry-after") || 30), 120) * 1000;
              console.log(`429 on ${p.split("?")[0].replace(/[A-Za-z0-9]{15,}/g, "…")}; waiting ${wait / 1000}s`);
              await sleep(wait); return get(p, tries + 1);
            }
            let j = {}; try { j = await r.json(); } catch {}
            return [r.status, j];
          }
          const errOf = (j) => String(j.err || j.message || j.error || "").slice(0, 200);
          const arr = (j, ...keys) => { for (const k of keys) if (Array.isArray(j?.[k])) return j[k]; return []; };
          const ex = (list, x) => { if (list.length < 5) list.push(x); };

          const PREFIX = /^\s*\[(wip|spec|replica|archive)\]/;
          const PREFIX_CI = /^\s*\[(wip|spec|replica|archive)\]/i;
          const NEAR = /\b(wip|spec|replica|archive|draft|final|old|deprecated|explor\w*)\b/i;
          const FILE_CONV = /^[^·]+ · [^·]+ · RM-\d+\s*$/;
          const RM = /\bRM[-_ ]?(\d+)\b/i;
          const OFFICIAL = /^\s*1\s*[·.\-:)]?\s*official\b/i;
          const OFFICIAL_LOOSE = /official/i;
          const NUMBERED = /^\s*\d+\s*[·.\-:)]?\s+\S/;
          const VFORK = /[-_ ]v\d+\b/i;
          const TOPTYPES = new Set(["FRAME", "SECTION", "COMPONENT", "COMPONENT_SET", "GROUP", "INSTANCE"]);

          for (const [team, id] of Object.entries(teams)) {
            const t = {
              listing: "", filesKeys: "", folders: 0, filesListed: 0, sampled: 0, readOk: 0,
              fileConv: 0, fileHasRM: 0, rmIds: [], vFork: 0, pageNumbered: 0,
              officialStrict: 0, officialLoose: 0,
              offTop: 0, offPrefixed: 0, offPrefixedCI: 0, offNear: 0,
              allTop: 0, allPrefixed: 0, allPrefixedCI: 0,
              prefixCounts: { wip: 0, spec: 0, replica: 0, archive: 0 },
              wipFrames: 0, wipFramesStale30: 0, filesStale30: 0, filesStale90: 0,
              withComments: 0, comments: 0, topThreads: 0, unresolvedThreads: 0, commentsErr: 0,
              pageNames: {}, ex: { fileNames: [], nonConvFileNames: [], rmFiles: [], offUnprefixed: [], nearMiss: [], prefixed: [] },
            };
            // 1. Listing: v2 folders, fall back to v1 projects.
            let [s, j] = await get(`/v2/teams/${id}/folders`);
            let folders = arr(j, "folders", "projects", "data");
            let filesPath = (fid) => `/v2/folders/${fid}/files`;
            t.listing = `v2 folders ${s}${s !== 200 ? " " + errOf(j) : ""}; keys=${Object.keys(j).join(",")}`;
            if (s !== 200) {
              const [s1, j1] = await get(`/v1/teams/${id}/projects`);
              t.listing += ` | v1 projects ${s1}${s1 !== 200 ? " " + errOf(j1) : ""}`;
              if (s1 === 200) { folders = arr(j1, "projects"); filesPath = (fid) => `/v1/projects/${fid}/files`; }
            }
            t.folders = folders.length;
            const files = [];
            for (const f of folders) {
              const [fs, fj] = await get(filesPath(f.id));
              if (fs !== 200) { t.listing += ` | files ${fs} ${errOf(fj)}`; continue; }
              if (!t.filesKeys) t.filesKeys = Object.keys(fj).join(",");
              files.push(...arr(fj, "files", "data"));
            }
            t.filesListed = files.length;
            // 2. Sample: all if <= SAMPLE, else evenly spaced by last_modified (old and new both).
            files.sort((a, b) => String(a.last_modified).localeCompare(String(b.last_modified)));
            const sample = files.length <= SAMPLE ? files
              : Array.from({ length: SAMPLE }, (_, i) => files[Math.floor((i * (files.length - 1)) / (SAMPLE - 1))]);
            t.sampled = sample.length;
            for (const f of sample) {
              const key = f.key;
              const name = f.name || "";
              ex(t.ex.fileNames, name);
              if (FILE_CONV.test(name)) t.fileConv++; else ex(t.ex.nonConvFileNames, name);
              const rm = name.match(RM);
              if (rm) { t.fileHasRM++; t.rmIds.push(Number(rm[1])); ex(t.ex.rmFiles, name); }
              if (VFORK.test(name)) t.vFork++;

              const [, mj] = await get(`/v1/files/${key}/meta`);
              const lm = Date.parse(mj?.file?.last_touched_at || mj?.file?.last_modified || f.last_modified || "");
              const ageDays = Number.isFinite(lm) ? (NOW - lm) / DAY : NaN;
              if (ageDays > 30) t.filesStale30++;
              if (ageDays > 90) t.filesStale90++;

              const [ds, dj] = await get(`/v1/files/${key}?depth=2`);
              if (ds !== 200) { t.listing += ` | file ${ds} ${errOf(dj)}`; continue; }
              t.readOk++;
              const pages = dj.document?.children || [];
              if (pages.length && pages.every((p) => NUMBERED.test(p.name))) t.pageNumbered++;
              for (const p of pages) t.pageNames[p.name.trim()] = (t.pageNames[p.name.trim()] || 0) + 1;
              const off = pages.find((p) => OFFICIAL.test(p.name));
              const offLoose = off || pages.find((p) => OFFICIAL_LOOSE.test(p.name));
              if (off) t.officialStrict++;
              if (offLoose) t.officialLoose++;
              for (const p of pages) {
                const tops = (p.children || []).filter((n) => TOPTYPES.has(n.type));
                for (const n of tops) {
                  t.allTop++;
                  const m = n.name.match(PREFIX_CI);
                  if (PREFIX.test(n.name)) { t.allPrefixed++; ex(t.ex.prefixed, n.name.slice(0, 60)); }
                  if (m) {
                    t.allPrefixedCI++; t.prefixCounts[m[1].toLowerCase()]++;
                    if (m[1].toLowerCase() === "wip") { t.wipFrames++; if (ageDays > 30) t.wipFramesStale30++; }
                  }
                  if (p === offLoose) {
                    t.offTop++;
                    if (PREFIX.test(n.name)) t.offPrefixed++;
                    if (m) t.offPrefixedCI++;
                    else {
                      if (NEAR.test(n.name)) { t.offNear++; ex(t.ex.nearMiss, n.name.slice(0, 60)); }
                      ex(t.ex.offUnprefixed, n.name.slice(0, 60));
                    }
                  }
                }
              }
              const [cs, cj] = await get(`/v1/files/${key}/comments`);
              if (cs !== 200) { t.commentsErr++; continue; }
              const cm = arr(cj, "comments");
              if (cm.length) t.withComments++;
              t.comments += cm.length;
              const top = cm.filter((c) => !c.parent_id);
              t.topThreads += top.length;
              t.unresolvedThreads += top.filter((c) => !c.resolved_at).length;
            }
            t.pageNames = Object.fromEntries(Object.entries(t.pageNames).sort((a, b) => b[1] - a[1]).slice(0, 10));
            t.rmIds = [...new Set(t.rmIds)].sort((a, b) => a - b);
            console.log(`\n=== ${team} ===\n${JSON.stringify(t)}`);
          }
          console.log(`\nTOTAL API calls: ${calls}`);
          JS

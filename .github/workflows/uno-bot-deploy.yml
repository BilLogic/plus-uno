name: uno-bot — deploy Worker

# Deploys agents/uno-bot to Cloudflare from CI — the push-button replacement for
# a local `npx wrangler deploy`. Runs `npm run deploy`, which bundles the harness
# (bundle:harness → src/generated/harness.ts) and ships src/ via wrangler, then
# verifies /health responds with the fresh build stamp.
#
# Runs on every push to `main`, and on demand (workflow_dispatch).
#
# This was deliberately manual-only until 2026-08-17, on the reasoning that
# auto-deploy would ship half-reviewed Worker changes. That traded the wrong
# risk. The harness is bundled at BUILD time (bundle:harness → the baked
# src/generated/harness.ts, Block 0 of every request), so a merged rule change
# only reaches the bot when someone remembers to press this button — and the
# invalidation therefore never fired. The live consequence: rules that were
# reviewed, merged and believed-live sat in main while the bot kept answering
# from the previously-deployed copy.
#
# Review is not what was protecting main here. Until 2026-08-26 nothing in this
# repo ran on a PR at all; `check-harness.yml` now does, and it composes
# `check:harness-bundle`, so a stale bundle is caught on the branch rather than
# here. What protects the DEPLOY is still the gating inside `npm run deploy`
# (typecheck · check:fetch · check:contract · bundle:harness · wrangler deploy),
# and that runs either way — the PR gate deliberately leaves `check:fetch` and
# `check:contract` to this boundary (scripts/check-harness.mjs § EXCLUDED).
#
# `check:contract` is only a real gate when the app repo is checked out beside
# this one — it compares the vendored blueprint contract against the app's
# canonical copy. Until 2026-08-17 it exited 0 on a missing checkout, i.e. it
# passed on every runner without comparing anything while this header called it
# a gate. It now FAILS on a missing source unless BLUEPRINT_CONTRACT_OPTIONAL=1,
# which the step below sets only when BLUEPRINT_REPO_TOKEN is unconfigured.
#
# That is still not a gate, and #258 is the record of what it cost: the skip
# banner printed on every deploy, nobody read it — a SKIPPED line inside a job
# that finishes green is invisible — and the vendored contract drifted for real
# while the gate said nothing. Two changes since:
#
#   - The script now writes a ::warning:: annotation and a job-summary line when
#     it skips, and a summary line when it actually compares. A reader can tell
#     "compared and matched" from "never compared" without opening the log.
#   - `vars.BLUEPRINT_CONTRACT_REQUIRED` closes the escape hatch from repo
#     settings, no PR needed. Set it to 1 once BLUEPRINT_REPO_TOKEN exists and
#     an absent checkout stops deploying instead of quietly not checking.
#
# The order matters: configure the secret, watch one deploy log say `vendored
# contract matches the app`, and only then set the variable. Setting it first
# stops every deploy.
# Bill's call, 2026-08-17: any push to main, NOT paths-filtered — a harness doc
# under docs/ or skills/ changes the prompt just as much as a change under src/,
# and a path filter is the exact mechanism that would reintroduce this bug.
#
# `concurrency` cancels a superseded in-flight run: two pushes landing close
# together would otherwise race two `wrangler deploy`s at the same Worker, and
# the health check below could then verify the build stamp of whichever finished
# first rather than of the newest commit.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN     API token with the "Edit Cloudflare Workers" template
#                            (dash.cloudflare.com/profile/api-tokens), scoped to
#                            the Bryanhuang628 account. Store it on the
#                            `uno-bot-production` ENVIRONMENT, not as a plain repo
#                            secret — see below.
#   BLUEPRINT_REPO_TOKEN     read access to BilLogic/plus-uno-blueprint, so
#                            check:contract can actually compare. UNCONFIGURED as of
#                            #258 — without it the contract gate reports SKIPPED on
#                            every run and has never compared anything.
#
# Optional variables — LEAVE UNSET until the sequencing above is done:
#   BLUEPRINT_CONTRACT_REQUIRED  set to 1 to make an absent app checkout FAIL the
#                            deploy rather than skip the contract gate. Setting this
#                            before BLUEPRINT_REPO_TOKEN exists stops EVERY deploy,
#                            so: configure the secret, watch one deploy say
#                            `vendored contract matches the app`, then set this.
# The account id is non-secret and pinned below (the account that hosts uno-bot).
#
# WHY AN ENVIRONMENT. `main` is unprotected and this repo has 19 people who can
# push to it. A plain repo secret is readable by any workflow this job runs, so
# auto-deploy-on-push handed a Workers-edit token to a job that executes
# whatever code the pushed commit contains. Binding the job to a GitHub
# Environment with required reviewers keeps the automatic build and puts one
# human approval in front of the token. Create it at
# Settings → Environments → `uno-bot-production`: add the required reviewer(s),
# then move CLOUDFLARE_API_TOKEN there from repo secrets. Until the environment
# exists, runs will queue for approval rather than deploy — that is the intended
# failure direction.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time. Superseded runs are cancelled rather than queued: an
# older commit finishing last would leave the Worker behind main.
concurrency:
  group: uno-bot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The approval gate in front of CLOUDFLARE_API_TOKEN. See the header.
    environment: uno-bot-production
    # Hoisted so a STEP can branch on whether the token exists.
    #
    # `secrets` is not one of the contexts GitHub allows in a step-level `if:`
    # — only job-level `env`, `with` and `run` may read it. The checkout step
    # below carried `if: ${{ secrets.BLUEPRINT_REPO_TOKEN != '' }}`, which made
    # the whole FILE invalid: every run since then failed in 0s with "this run
    # likely failed because of a workflow file issue", before a single step
    # executed. Found 2026-08-22 — every run on main had failed since at least
    # 08-19, so the auto-deploy added on 08-17 had never once shipped, which is
    # precisely the stale-prompt failure this workflow's header describes.
    env:
      HAS_BLUEPRINT_TOKEN: ${{ secrets.BLUEPRINT_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The app repo, so check:contract has something to compare against.
      # Skipped (not failed) when the token is unconfigured — the deploy step
      # then reports the contract gate as SKIPPED rather than as passing.
      - name: Check out uno-blueprint (contract source)
        if: env.HAS_BLUEPRINT_TOKEN == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: BilLogic/plus-uno-blueprint
          token: ${{ secrets.BLUEPRINT_REPO_TOKEN }}
          path: uno-blueprint-src
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22" # wrangler v4.97+ requires Node >= 22
      - name: Install deps
        working-directory: agents/uno-bot
        run: npm ci
      # The deploy step below regenerates the harness before shipping, so
      # production never gets a stale one. What drifts is the COMMITTED
      # artifact — which is what local runs, `npm test` and code review read.
      # On 2026-08-21 it sat 1.6k chars behind two convention edits and nothing
      # said so. This keeps the file in the repo honest about what the bot is
      # actually told.
      - name: Harness bundle is current
        working-directory: agents/uno-bot
        env:
          # No BLUEPRINT_CONTRACT_* here: `bundle-harness.mjs` never reads them
          # and never invokes the contract script, so setting them on this step
          # only suggested to a reader that the gate runs twice. Measured —
          # `BLUEPRINT_CONTRACT_REQUIRED=1` with no checkout still exits 0 here.
          BLUEPRINT_REPO: ${{ github.workspace }}/uno-blueprint-src
        run: npm run check:harness-bundle
      - name: Bundle harness + deploy
        working-directory: agents/uno-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "747a73feeb756fad6c1164df234628e9"
          BLUEPRINT_REPO: ${{ github.workspace }}/uno-blueprint-src
          BLUEPRINT_CONTRACT_OPTIONAL: ${{ secrets.BLUEPRINT_REPO_TOKEN != '' && '0' || '1' }}
          # The switch that closes the skip, set from repo VARIABLES rather than
          # this file so turning the gate on for real needs no PR (#258). Unset
          # today, because the secret below does not exist yet and a hard
          # requirement would stop every deploy before it could ever pass once.
          BLUEPRINT_CONTRACT_REQUIRED: ${{ vars.BLUEPRINT_CONTRACT_REQUIRED }}
        run: npm run deploy
      - name: Verify health
        # Asserts the build it just deployed is the build now serving, AND that
        # it is still serving a couple of minutes later.
        #
        # Two things this has had to learn. First (#249): the old check matched
        # "uno-bot ok "* and so passed against a Worker still running last
        # week's bundle — the exact failure /health exists to catch. Now that
        # the stamp is derived from this run it can be compared, so it is.
        #
        # Second (#278): comparing once is a claim about a MOMENT, not about the
        # deploy. This Worker HAD a second deployer — Cloudflare Workers Builds,
        # whose command lived in the Cloudflare dashboard and could not be read
        # from here. Measured on 50782f79: this job deployed r131-50782f7 and
        # confirmed it at 17:20:45; 36 seconds later /health turned over and
        # stayed there for six minutes, 24 samples, with this run green
        # throughout. On 9f6030c it was worse — /health read `unstamped` on the
        # FIRST sample and this job's build never appeared at all, and
        # `unstamped` is unreachable from scripts/deploy.mjs, so that bundle had
        # run none of the gates above.
        #
        # The integration was disconnected on 2026-08-28. A first attempt did
        # not take, and the deploy that "verified" it was a workflow_dispatch —
        # which Workers Builds does not trigger on, so it could not have caught
        # anything. The next real push proved it was still live.
        #
        # What it was, read off the dashboard: repository BilLogic/plus-uno,
        # production branch main, non-production branch builds enabled, root
        # directory agents/uno-bot, and a deploy command of `npx wrangler
        # deploy` — NOT `npm run deploy`. That one line is the whole incident.
        # It never invoked scripts/deploy.mjs, so no --define reached the bundle
        # (hence `unstamped`) and none of the gates above ran. In place since
        # 2026-07-08.
        #
        # The hold STAYS. It is what made a silent overwrite visible, and it is
        # what would notice a third deployer or this being reconnected. 150s per
        # deploy is the cheapest alarm in this file.
        #
        # The logic is a module, not a bash loop in a YAML string, because it
        # now has edge cases worth testing — an unreachable Worker must not read
        # as an overwrite. See scripts/verify-deployed.test.mjs.
        working-directory: agents/uno-bot
        env:
          # Escape hatch. Set the repo variable to 0 if this hold is ever the
          # thing standing between a fix and production; it restores the old
          # first-answer-wins behaviour, loudly, in the log.
          UNO_BOT_HOLD_SAMPLES: ${{ vars.UNO_BOT_HOLD_SAMPLES }}
        run: node scripts/verify-deployed-cli.mjs

name: Netlify daily production deploy

# Production on Netlify no longer publishes on every merge (see netlify.toml
# [context.production]). This calls the daily-production build hook once a day
# when main has new commits, and on demand from the Actions tab.
on:
  schedule:
    - cron: "0 11 * * *" # 06:00 ET (07:00 during daylight time)
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if main has no new commits in the last day"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Check for new commits
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No commits on main in the last 25 hours; skipping."
          fi
      - name: Trigger production build
        if: steps.changes.outputs.deploy == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_PRODUCTION_HOOK }}
        run: |
          test -n "$HOOK" || { echo "NETLIFY_PRODUCTION_HOOK secret is missing"; exit 1; }
          curl -fsS -X POST -d '{}' "$HOOK?trigger_title=daily-production"

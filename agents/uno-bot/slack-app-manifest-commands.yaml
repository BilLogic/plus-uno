# THIS IS A FRAGMENT, NOT A MANIFEST. Pasting the whole file into Slack's
# App Manifest editor fails with:  Invalid additional property: slash_commands
# — because `slash_commands` belongs UNDER `features:`, and at the top level
# there is no such key. Paste slack-app-manifest.yaml instead; it already
# carries these commands in the right place.
#
# GENERATED by scripts/generate-uno-skill-surfaces.mjs — do not edit.
# Source of truth: skills/uno-*/SKILL.md frontmatter.
# Regenerate: npm run generate:skill-surfaces
#
# What it is FOR: the rows to merge under `features:` when a uno-* skill is
# added or renamed, so the manifest and the skills cannot drift.
# Declaring a slash command also requires the `commands` bot scope; adding
# it prompts a workspace reinstall.
#
# The Worker must be deployed with the /slack/commands route BEFORE these
# land, or every invocation returns Slack's dispatch_failed to the caller.
slash_commands:
  - command: /uno-maintain
    url: https://uno-bot.plus-uno.workers.dev/slack/commands
    description: "File an intake, run a standing sweep, or capture a lesson into the harness"
    usage_hint: "[intake / sweep-name / lesson-to-capture]"
    should_escape: false
  - command: /uno-prototype
    url: https://uno-bot.plus-uno.workers.dev/slack/commands
    description: "Turn a PRD into a design artifact at the fidelity you pick, grounded on the blueprint"
    usage_hint: "[prd-required] [fidelity]"
    should_escape: false
  - command: /uno-publish
    url: https://uno-bot.plus-uno.workers.dev/slack/commands
    description: "Share finished-enough work for feedback, or hand it off to development"
    usage_hint: "[prototype-or-project]"
    should_escape: false
  - command: /uno-research
    url: https://uno-bot.plus-uno.workers.dev/slack/commands
    description: "Gather context that doesn't exist yet — evidence sweeps, study guides, discovery"
    usage_hint: "[question / hunch / who-knows-X]"
    should_escape: false
  - command: /uno-review
    url: https://uno-bot.plus-uno.workers.dev/slack/commands
    description: "Diagnose-only design review: design-system, product-intent, and accessibility lenses"
    usage_hint: "[artifact + manifest (fidelity / tools / PRD link)]"
    should_escape: false
  - command: /uno-synthesize
    url: https://uno-bot.plus-uno.workers.dev/slack/commands
    description: "Distill gathered context into findings, takeaways, and — on your go — a PRD"
    usage_hint: "[sources-to-distill | \"draft the PRD\"]"
    should_escape: false
